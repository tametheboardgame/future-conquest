name: R3 WP2B lazy-load patch

on:
  push:
    branches:
      - agent/r3-wp2b-real-terrain
    paths:
      - .github/workflows/r3-wp2b-lazy-load.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r3-wp2b-real-terrain
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/r3-wp2b-lazy-load.mjs
      - name: Commit lazy-load wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          if git diff --cached --quiet; then
            echo "Already patched"
          else
            git commit -m "Lazy-load experimental terrain renderer"
            git push origin HEAD:agent/r3-wp2b-real-terrain
          fi
