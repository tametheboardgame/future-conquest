name: R3 WP2B terrain smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/components/TerrainMapPrototype*.tsx'
      - 'src/presentation/r3-terrain-*.ts'
      - 'src/r3-terrain-prototype.css'
      - 'public/generated/r3-terrain/**'
      - 'scripts/measure-r3-terrain-budget.mjs'
      - 'tests/r3-wp2b-*.test.cjs'
      - 'tests/r3-wp2d-*.test.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/r3-wp2b-lazy-load.yml'

permissions:
  contents: read

jobs:
  terrain-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run WP2B/WP2D focused regressions
        run: node --test tests/r3-wp2b-*.test.cjs tests/r3-wp2d-*.test.cjs
      - name: Build production game
        run: npm run build
      - name: Verify Copernicus terrain ships in production output
        run: |
          test -f dist/generated/r3-terrain/tiles.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const manifest = JSON.parse(fs.readFileSync('dist/generated/r3-terrain/tiles.json', 'utf8'));
          const expected = manifest?.futureConquest?.stats?.tiles;
          const walk = root => fs.readdirSync(root, { withFileTypes: true }).flatMap(entry => {
            const location = path.join(root, entry.name);
            return entry.isDirectory() ? walk(location) : [location];
          });
          const actual = walk('dist/generated/r3-terrain/tiles').filter(file => file.endsWith('.png')).length;
          if (!Number.isInteger(expected) || expected <= 0) throw new Error(`Invalid manifest tile count: ${expected}`);
          if (actual !== expected) throw new Error(`Expected ${expected} terrain tiles from manifest; found ${actual}`);
          console.log(`Verified ${actual} Terrain-RGB tiles from production manifest.`);
          NODE
      - name: Enforce terrain production budget
        run: node scripts/measure-r3-terrain-budget.mjs
