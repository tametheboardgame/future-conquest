name: Connector staging cleanup

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/connector-stage-publish.yml]

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo}=context.repo;
            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: context.payload.pull_request.number,
              state: 'closed'
            });
            await github.rest.git.deleteRef({
              owner,
              repo,
              ref: 'heads/agent/connector-stage-publish'
            });
