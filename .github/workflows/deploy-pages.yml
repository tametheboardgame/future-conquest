name: Build and deploy Future Conquest

# Deployment refresh: 2026-08-06 18:28 BST
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply tutorial explanation pass
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/improve-logistics-intelligence-tutorial'
        run: node scripts/run-tutorial-explanation-pass.mjs
      - name: Install dependencies
        run: npm ci
      - name: Run engine tests
        run: npm test
      - name: Validate deployment verifier
        run: node --check scripts/verify-pages-deployment.mjs
      - name: Build game
        run: npm run build
      - name: Commit validated tutorial implementation
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/improve-logistics-intelligence-tutorial'
        run: |
          git checkout origin/main -- .github/workflows/deploy-pages.yml
          rm -f .github/workflows/apply-tutorial-explanation-pass.yml
          rm -f scripts/apply-tutorial-explanation-pass.mjs
          rm -f scripts/run-tutorial-explanation-pass.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs .github scripts
          if git diff --cached --quiet; then
            echo "No tutorial source changes to commit."
          else
            git commit -m "Improve Logistics and Intelligence tutorial"
            git push origin HEAD:agent/improve-logistics-intelligence-tutorial
          fi
      - name: Write deployment metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          node --input-type=module -e "import { writeFile } from 'node:fs/promises'; await writeFile('dist/build-info.json', JSON.stringify({ sha: process.env.GITHUB_SHA, runNumber: process.env.GITHUB_RUN_NUMBER, runAttempt: process.env.GITHUB_RUN_ATTEMPT, builtAt: new Date().toISOString() }, null, 2) + '\n');"
      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout deployment verifier
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live deployment commit
        timeout-minutes: 7
        env:
          DEPLOY_VERIFY_ATTEMPTS: '30'
          DEPLOY_VERIFY_DELAY_MS: '10000'
        run: node scripts/verify-pages-deployment.mjs "${{ steps.deployment.outputs.page_url }}" "${{ github.sha }}"
