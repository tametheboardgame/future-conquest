name: Build and deploy Future Conquest

# Deployment refresh: 2026-08-07 06:01 BST
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run engine tests
        run: npm test
      - name: Validate deployment verifier
        run: node --check scripts/verify-pages-deployment.mjs
      - name: Build game
        run: npm run build
      - name: Write deployment metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          node --input-type=module -e "import { writeFile } from 'node:fs/promises'; await writeFile('dist/build-info.json', JSON.stringify({ sha: process.env.GITHUB_SHA, runNumber: process.env.GITHUB_RUN_NUMBER, runAttempt: process.env.GITHUB_RUN_ATTEMPT, builtAt: new Date().toISOString() }, null, 2) + '\n');"
      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publish-wp3-direct:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 108
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WP3 head branch
        uses: actions/checkout@v4
        with:
          ref: agent/r2-wp3-territory-resources
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply direct WP3 implementation
        run: |
          node scripts/apply-wp3-direct.mjs
          node scripts/fix-wp3-direct.mjs
      - name: Validate implementation before publication
        run: |
          npm test
          npm run build
          node --test tests/persistence.test.cjs tests/persistence-ui.test.cjs
          git diff --check
      - name: Publish canonical WP3 implementation
        run: |
          git config user.name "future-conquest-supervisor[bot]"
          git config user.email "future-conquest-supervisor[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- .github/workflows/deploy-pages.yml
          rm -f .github/workflows/wp3-direct-publish.yml .github/workflows/wp3-apply-fast.yml scripts/apply-wp3-direct.mjs scripts/fix-wp3-direct.mjs
          git add -A
          git commit -m "feat: implement R2-WP3 territory logistics"
          git push origin HEAD:agent/r2-wp3-territory-resources

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout deployment verifier
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live deployment commit and title asset
        timeout-minutes: 7
        env:
          DEPLOY_VERIFY_ATTEMPTS: '30'
          DEPLOY_VERIFY_DELAY_MS: '10000'
        run: node scripts/verify-pages-deployment.mjs "${{ steps.deployment.outputs.page_url }}" "${{ github.sha }}"
