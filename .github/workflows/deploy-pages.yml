name: Build save load reliability hotfix

on:
  push:
    branches:
      - agent/save-load-reliability

permissions:
  contents: write

jobs:
  build-hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: agent/save-load-reliability
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Correct builder type guard
        run: sed -i 's/state: GameState;/state: unknown;/' scripts/apply-save-load-hotfix.py
      - name: Apply save load hotfix
        run: python scripts/apply-save-load-hotfix.py
      - name: Install dependencies
        run: npm ci
      - name: Run complete regression suite
        run: npm test
      - name: Build production game
        run: npm run build
      - name: Restore workflow and commit completed hotfix
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/deploy-pages.yml
          rm -f .github/workflows/save-load-hotfix-builder.yml
          rm -f scripts/apply-save-load-hotfix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/main.tsx src/game/engine.ts src/save-load.css tests/save-load.test.cjs tests/save-load-ui.test.cjs .github/workflows/deploy-pages.yml
          git add -u .github/workflows/save-load-hotfix-builder.yml scripts/apply-save-load-hotfix.py
          git commit -m "Fix save load reliability and feedback"
          git push origin HEAD:agent/save-load-reliability
