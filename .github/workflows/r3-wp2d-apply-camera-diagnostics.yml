name: Apply R3 WP2D camera diagnostics

on:
  push:
    branches:
      - agent/r3-wp2d-terrain-refinement
    paths:
      - 'scripts/apply-r3-wp2d-camera-diagnostics.mjs'
      - '.github/workflows/r3-wp2d-apply-camera-diagnostics.yml'

permissions:
  contents: write

jobs:
  apply-camera-diagnostics:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r3-wp2d-terrain-refinement
          fetch-depth: 0
      - name: Apply camera diagnostics
        run: node scripts/apply-r3-wp2d-camera-diagnostics.mjs
      - name: Commit camera diagnostics
        run: |
          git add src/components/TerrainMapPrototypeImpl.tsx
          if git diff --cached --quiet; then
            echo 'Camera diagnostics already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Expose derived terrain camera zoom metadata'
          git push origin HEAD:agent/r3-wp2d-terrain-refinement
