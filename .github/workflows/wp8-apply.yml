name: WP8 guided-help integration

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wp8:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout WP8 branch
        uses: actions/checkout@v4
        with:
          ref: agent/wp8-guided-help-remediation
          fetch-depth: 0

      - name: Apply WP8 integration
        run: python scripts/wp8-apply.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run repository regression suite
        run: npm test

      - name: Commit validated WP8 integration
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/wp8-apply.py .github/workflows/wp8-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/operational-clarity.ts \
                  src/App.tsx \
                  src/components/LogisticsCommand.tsx \
                  src/components/InfrastructureCommand.tsx \
                  tests/tutorial-explanation-phases.test.cjs
          git add -u scripts/wp8-apply.py .github/workflows/wp8-apply.yml
          echo "WP8 integration diff:"
          git diff --cached --name-only
          git commit -m "WP8: integrate current-system guided help"
          git push origin HEAD:agent/wp8-guided-help-remediation
