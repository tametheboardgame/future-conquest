name: Verify Phase VIII-B2 live release

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'agent/verify-viii-b2-release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout released main commit
        uses: actions/checkout@v4
        with:
          ref: 884e49c2b794240e902ba46fcf77005b851137e9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run released regression suite
        run: npm test

      - name: Build released production bundle
        run: npm run build

      - name: Verify released source markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q "PHASE VIII-B2 / ROUTE MOVEMENT" src/App.tsx
          grep -q "future-conquest-slice-v0.7" src/game/persistence.ts
          grep -q "movementProgressForDay" src/game/route-movement.ts
          grep -q "route-blocked" src/game/order-targeting.ts
          grep -q "Operational corridor" src/App.tsx
          grep -q "damaged corridors and heavy-equipment" tests/route-movement-viii-b2.test.cjs || grep -q "route damage and heavy-equipment restrictions" tests/route-movement-viii-b2.test.cjs
          test ! -e .github/workflows/apply-viii-b2.yml
          test ! -e scripts/apply-viii-b2.py
          test ! -e scripts/update-viii-b2-tests.py

      - name: Verify GitHub Pages bundle
        shell: bash
        run: |
          set -euo pipefail
          site='https://tametheboardgame.github.io/future-conquest/'
          success=0

          for attempt in $(seq 1 30); do
            html=$(curl --fail --silent --show-error --location \
              -H 'Cache-Control: no-cache' \
              "${site}?verify_viii_b2=${GITHUB_RUN_ID}_${attempt}") || true

            js_path=$(printf '%s' "$html" | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -n 1 || true)

            if [[ -n "$js_path" ]]; then
              js=$(curl --fail --silent --show-error --location \
                -H 'Cache-Control: no-cache' \
                "${site}${js_path}?verify=${GITHUB_RUN_ID}_${attempt}") || true

              if printf '%s' "$js" | grep -q 'PHASE VIII-B2 / ROUTE MOVEMENT' \
                && printf '%s' "$js" | grep -q 'future-conquest-slice-v0.7' \
                && printf '%s' "$js" | grep -q 'Operational corridor' \
                && printf '%s' "$js" | grep -q 'Corridor blocked'; then
                echo "Verified live Phase VIII-B2 bundle: $js_path"
                success=1
                break
              fi
            fi

            echo "Live bundle not updated yet; attempt ${attempt}/30"
            sleep 10
          done

          if [[ "$success" -ne 1 ]]; then
            echo 'Phase VIII-B2 markers were not found in the live GitHub Pages bundle.' >&2
            exit 1
          fi
