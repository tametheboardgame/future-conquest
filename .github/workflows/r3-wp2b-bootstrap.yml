name: R3 WP2B dependency bootstrap

on:
  push:
    branches:
      - agent/r3-wp2b-real-terrain
    paths:
      - .github/workflows/r3-wp2b-bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap-maplibre:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WP2B branch
        uses: actions/checkout@v4
        with:
          ref: agent/r3-wp2b-real-terrain
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install MapLibre GL JS 6
        run: npm install --save maplibre-gl@6.0.0
      - name: Commit dependency lock update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency already present"
          else
            git commit -m "Add MapLibre GL terrain dependency"
            git push origin HEAD:agent/r3-wp2b-real-terrain
          fi
