name: R3 WP3.9C portal arrival gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/components/PortalArrivalSequence.tsx'
      - 'src/components/portal-arrival.css'
      - 'src/components/StartupExperience.tsx'
      - 'scripts/probe-r3-wp3-9c-portal-arrival.mjs'
      - 'tests/r3-wp3-9c-portal-arrival.test.cjs'
      - 'tests/r3-wp3-9c-arrival-visibility.test.cjs'
      - 'docs/roadmap/R3-WP3.9-MAP-TIGHTENING.md'
      - '.github/workflows/r3-wp3-9c-portal-arrival.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portal-arrival-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run WP3.9C source contracts
        run: node --test tests/r3-wp3-9c-portal-arrival.test.cjs tests/r3-wp3-9c-arrival-visibility.test.cjs
      - name: Build production game
        run: npm run build
      - name: Install browser probe runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start exact production preview
        run: npm run preview -- --host 127.0.0.1 > /tmp/r3-wp39c-preview.log 2>&1 &
      - name: Probe portal arrival lifecycle
        run: node scripts/probe-r3-wp3-9c-portal-arrival.mjs
      - name: Upload WP3.9C browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-wp3-9c-portal-arrival-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/r3-wp3-9c
            /tmp/r3-wp39c-preview.log
          if-no-files-found: warn
