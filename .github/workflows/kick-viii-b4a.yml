name: Kick Phase VIII-B4A

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build:
    if: github.head_ref == 'agent/infrastructure-disruption-viii-b4a'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/infrastructure-disruption-viii-b4a
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extract and run implementation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/build-viii-b4a.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == '- name: Apply Phase VIII-B4A implementation')
          run_line = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'run: |')
          end = next(i for i in range(run_line + 1, len(lines)) if lines[i].strip() == '- name: Install dependencies')
          block = lines[run_line + 1:end]
          prefix = '          '
          script = '\n'.join(line[len(prefix):] if line.startswith(prefix) else line for line in block) + '\n'
          Path('/tmp/apply-viii-b4a.sh').write_text(script)
          PY
          bash /tmp/apply-viii-b4a.sh

      - name: Harden compatibility and daily sequencing
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          disruption = Path('src/game/infrastructure-disruption.ts')
          text = disruption.read_text()
          text = text.replace("import { TERRITORIES } from './data';\n", '')
          text = text.replace(
              "    } else {\n      cause = 'enemy-interdiction';\n      risk = 0.025 + state.escalation / 950;\n    }\n",
              "    } else {\n      if (state.escalation < 20) return [];\n      cause = 'enemy-interdiction';\n      risk = (state.escalation - 15) / 700;\n    }\n"
          )
          disruption.write_text(text)

          engine = Path('src/game/engine.ts')
          text = engine.read_text()
          old = "  next = resolveMovement(next);\n  next = resolveOperations(next);\n  next = resolveOccupationAndLogistics(next);\n  next = resolveInfrastructureRecovery(next);\n  next = resolveStrategicResponse(next);\n  next = resolveCounterattack(next);\n  next = resolveInfrastructureDisruption(next);\n"
          new = "  next = resolveInfrastructureRecovery(next);\n  next = resolveInfrastructureDisruption(next);\n  next = resolveMovement(next);\n  next = resolveOperations(next);\n  next = resolveOccupationAndLogistics(next);\n  next = resolveStrategicResponse(next);\n  next = resolveCounterattack(next);\n"
          if old not in text:
              raise SystemExit('Could not locate Phase VIII-B4A turn sequence')
          engine.write_text(text.replace(old, new, 1))

          for test_path in Path('tests').glob('*.test.cjs'):
              test = test_path.read_text()
              test = test.replace('PHASE VIII-B3 \\/ SUPPLY THROUGHPUT', 'PHASE VIII-B4A \\/ INFRASTRUCTURE DISRUPTION')
              test = test.replace('PHASE VIII-B3 / SUPPLY THROUGHPUT', 'PHASE VIII-B4A / INFRASTRUCTURE DISRUPTION')
              test = test.replace('assert.equal(state.version, 8);', 'assert.equal(state.version, 9);')
              test = test.replace('assert.equal(loaded.version, 8);', 'assert.equal(loaded.version, 9);')
              test = test.replace('assert.equal(upgraded.version, 8);', 'assert.equal(upgraded.version, 9);')
              test = test.replace('assert.equal(result.state.version, 8);', 'assert.equal(result.state.version, 9);')
              test = test.replace('saveVersion: 8,', 'saveVersion: 9,')
              test_path.write_text(test)

          persistence_test = Path('tests/persistence.test.cjs')
          test = persistence_test.read_text()
          test = test.replace('a current version 8 save is inspected with its matching metadata', 'a current version 9 save is inspected with its matching metadata')
          test = test.replace("assert.equal(result.source, 'v8');", "assert.equal(result.source, 'v9');", 1)
          test = test.replace('into version 8 logistics', 'through version 8 into version 9 logistics')
          test = test.replace('into version 8', 'into version 9')
          persistence_test.write_text(test)

          for test_path in [Path('tests/engine.test.cjs'), Path('tests/formation-organisation.test.cjs')]:
              test = test_path.read_text().replace('migrate to version 8', 'migrate to version 9')
              test_path.write_text(test)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run regression suite
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Commit implementation
        shell: bash
        run: |
          rm .github/workflows/build-viii-b4a.yml .github/workflows/kick-viii-b4a.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add infrastructure disruption and recovery"
          git push origin HEAD:agent/infrastructure-disruption-viii-b4a
