name: R3 WP3.9A map UX foundations gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/components/StartupExperience.tsx'
      - 'src/components/MapUxFoundations.tsx'
      - 'src/components/map-ux-foundations.css'
      - 'src/App.tsx'
      - 'src/command-interface.css'
      - 'scripts/probe-r3-wp3-9a-map-ux-foundations.mjs'
      - 'tests/r3-wp3-9a-map-ux-foundations.test.cjs'
      - 'docs/roadmap/R3-WP3.9-MAP-TIGHTENING.md'
      - '.github/workflows/r3-wp3-9a-map-ux-foundations.yml'

permissions:
  contents: read

jobs:
  map-ux-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run WP3.9A source contracts
        run: node --test tests/r3-wp3-9a-map-ux-foundations.test.cjs tests/command-panel-layout.test.cjs
      - name: Build production game
        run: npm run build
      - name: Install browser probe runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start exact production preview
        run: npm run preview -- --host 127.0.0.1 > /tmp/r3-wp39a-preview.log 2>&1 &
      - name: Probe default map and collapsible sidebar
        run: node scripts/probe-r3-wp3-9a-map-ux-foundations.mjs
      - name: Upload WP3.9A browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-wp3-9a-map-ux-${{ github.event.pull_request.head.sha }}
          path: |
            artifacts/r3-wp3-9a
            /tmp/r3-wp39a-preview.log
          if-no-files-found: warn
