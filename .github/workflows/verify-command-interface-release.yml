name: Verify command interface release

on:
  pull_request:
    types: [opened, reopened]

permissions:
  actions: read
  contents: write
  deployments: read
  pages: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify main build, deployment and live command interface
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const targetSha = 'e76314ca12afd4bfd047b7d0a99b67dfb2f9fa79';
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            const failures = [];

            try {
              let mainRun;
              for (let attempt = 0; attempt < 36; attempt += 1) {
                const runs = await github.rest.actions.listWorkflowRunsForRepo({
                  owner,
                  repo,
                  head_sha: targetSha,
                  per_page: 50
                });
                mainRun = runs.data.workflow_runs.find(run =>
                  run.name === 'Build and deploy Future Conquest' &&
                  run.event === 'push' &&
                  run.head_branch === 'main'
                );
                if (mainRun?.status === 'completed') break;
                await sleep(5000);
              }

              if (!mainRun) {
                failures.push('No main-branch push workflow was found for the command interface release commit.');
              } else {
                core.notice(`MAIN_RUN=${JSON.stringify({
                  id: mainRun.id,
                  status: mainRun.status,
                  conclusion: mainRun.conclusion,
                  head_branch: mainRun.head_branch,
                  head_sha: mainRun.head_sha,
                  html_url: mainRun.html_url
                })}`);
                if (mainRun.status !== 'completed' || mainRun.conclusion !== 'success') {
                  failures.push(`Main workflow did not complete successfully: ${mainRun.status}/${mainRun.conclusion}`);
                }

                const jobs = await github.rest.actions.listJobsForWorkflowRun({
                  owner,
                  repo,
                  run_id: mainRun.id,
                  filter: 'latest',
                  per_page: 100
                });
                core.notice(`MAIN_JOBS=${JSON.stringify(jobs.data.jobs.map(job => ({
                  name: job.name,
                  conclusion: job.conclusion,
                  steps: job.steps?.map(step => ({ name: step.name, conclusion: step.conclusion }))
                })))}`);
                const build = jobs.data.jobs.find(job => job.name === 'build');
                const deploy = jobs.data.jobs.find(job => job.name === 'deploy');
                if (build?.conclusion !== 'success') failures.push(`Main build job conclusion was ${build?.conclusion ?? 'missing'}.`);
                if (deploy?.conclusion !== 'success') failures.push(`Pages deploy job conclusion was ${deploy?.conclusion ?? 'missing'}.`);
              }

              const getText = async path => {
                const response = await github.rest.repos.getContent({ owner, repo, path, ref: targetSha });
                if (Array.isArray(response.data) || !('content' in response.data)) throw new Error(`Could not read ${path}`);
                return Buffer.from(response.data.content, 'base64').toString('utf8');
              };
              const app = await getText('src/App.tsx');
              const navigation = await getText('src/components/CommandNavigation.tsx');
              const stylesheet = await getText('src/command-interface.css');
              const sourceMarkers = {
                sixViews: ['map', 'forces', 'operations', 'territories', 'intelligence', 'campaign'].every(view => navigation.includes(`id: '${view}'`)),
                commandShell: app.includes('PHASE VII-A / COMMAND INTERFACE'),
                globalResolve: app.includes('global-resolve'),
                autosaveProxy: app.includes('persistence-save-proxy'),
                desktopNavigation: stylesheet.includes('grid-template-columns: 96px minmax(0, 1fr)'),
                mobileNavigation: stylesheet.includes('position: fixed') && stylesheet.includes('bottom: 0')
              };
              core.notice(`SOURCE_MARKERS=${JSON.stringify(sourceMarkers)}`);
              if (Object.values(sourceMarkers).some(value => !value)) {
                failures.push(`Release source is missing command-interface markers: ${JSON.stringify(sourceMarkers)}`);
              }

              const deployments = await github.rest.repos.listDeployments({
                owner,
                repo,
                sha: targetSha,
                environment: 'github-pages',
                per_page: 20
              });
              core.notice(`DEPLOYMENTS=${JSON.stringify(deployments.data.map(deployment => ({
                id: deployment.id,
                ref: deployment.ref,
                sha: deployment.sha,
                environment: deployment.environment
              })))}`);
              if (!deployments.data.length) {
                failures.push('No github-pages deployment record exists for the command interface release commit.');
              } else {
                let successfulDeployment = false;
                for (const deployment of deployments.data) {
                  const statuses = await github.rest.repos.listDeploymentStatuses({
                    owner,
                    repo,
                    deployment_id: deployment.id,
                    per_page: 20
                  });
                  core.notice(`DEPLOYMENT_${deployment.id}_STATUSES=${JSON.stringify(statuses.data.map(status => ({
                    state: status.state,
                    environment_url: status.environment_url,
                    log_url: status.log_url
                  })))}`);
                  if (statuses.data.some(status => status.state === 'success')) successfulDeployment = true;
                }
                if (!successfulDeployment) failures.push('No successful github-pages deployment status exists for the command interface release commit.');
              }

              const pages = await github.rest.repos.getPages({ owner, repo });
              const siteUrl = pages.data.html_url || 'https://tametheboardgame.github.io/future-conquest/';
              const indexResponse = await fetch(siteUrl, { cache: 'no-store' });
              if (!indexResponse.ok) {
                failures.push(`Live site returned HTTP ${indexResponse.status}.`);
              } else {
                const index = await indexResponse.text();
                const scriptMatch = index.match(/<script[^>]+src="([^"]+\.js)"/);
                const styleMatch = index.match(/<link[^>]+href="([^"]+\.css)"/);
                if (!scriptMatch) failures.push('Could not find the production JavaScript bundle in the live index.');
                if (!styleMatch) failures.push('Could not find the production stylesheet in the live index.');

                if (scriptMatch) {
                  const bundleUrl = new URL(scriptMatch[1], siteUrl).toString();
                  const bundleResponse = await fetch(bundleUrl, { cache: 'no-store' });
                  if (!bundleResponse.ok) {
                    failures.push(`Live JavaScript bundle returned HTTP ${bundleResponse.status}.`);
                  } else {
                    const bundle = await bundleResponse.text();
                    const liveMarkers = {
                      formationCommand: bundle.includes('Formation command'),
                      operationalCommand: bundle.includes('Operational command'),
                      territorialAdministration: bundle.includes('Territorial administration'),
                      strategicPicture: bundle.includes('Strategic picture'),
                      campaignControl: bundle.includes('Campaign control')
                    };
                    core.notice(`LIVE_JS=${JSON.stringify({ siteUrl, bundleUrl, ...liveMarkers })}`);
                    if (Object.values(liveMarkers).some(value => !value)) {
                      failures.push(`The live JavaScript bundle is missing command-interface markers: ${JSON.stringify(liveMarkers)}`);
                    }
                  }
                }

                if (styleMatch) {
                  const styleUrl = new URL(styleMatch[1], siteUrl).toString();
                  const styleResponse = await fetch(styleUrl, { cache: 'no-store' });
                  if (!styleResponse.ok) {
                    failures.push(`Live stylesheet returned HTTP ${styleResponse.status}.`);
                  } else {
                    const css = await styleResponse.text();
                    const styleMarkers = {
                      navigation: css.includes('.command-navigation'),
                      workspace: css.includes('.command-workspace'),
                      saveProxy: css.includes('.persistence-save-proxy'),
                      bottomNavigation: css.includes('bottom:0')
                    };
                    core.notice(`LIVE_CSS=${JSON.stringify({ styleUrl, ...styleMarkers })}`);
                    if (Object.values(styleMarkers).some(value => !value)) {
                      failures.push(`The live stylesheet is missing command-interface markers: ${JSON.stringify(styleMarkers)}`);
                    }
                  }
                }
              }
            } catch (error) {
              failures.push(`${error.status ?? 'error'}: ${error.message}`);
            } finally {
              try {
                await github.rest.pulls.update({
                  owner,
                  repo,
                  pull_number: context.payload.pull_request.number,
                  state: 'closed'
                });
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: 'heads/agent/verify-command-interface-release'
                });
              } catch (cleanupError) {
                core.warning(`Cleanup failed: ${cleanupError.message}`);
              }
            }

            if (failures.length) core.setFailed(failures.join('\n'));
