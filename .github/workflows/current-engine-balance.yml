name: WP2 clean generated validation outputs

on:
  pull_request:
    paths:
      - '.github/workflows/current-engine-balance.yml'
      - 'public/**'
      - 'src/generated/**'
      - 'src/assets/**'
      - 'src/game/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    if: github.head_ref == 'agent/wp2-logistics-defeat-model' || github.ref_name == 'agent/wp2-logistics-defeat-model'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WP2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/wp2-logistics-defeat-model
          fetch-depth: 0

      - name: Restore everything outside the WP2 allowlist
        run: |
          git fetch origin main
          while IFS= read -r path; do
            case "$path" in
              src/game/enemy-strategy.ts|\
              src/game/engine.ts|\
              src/game/operational-clarity.ts|\
              src/game/supply-network.ts|\
              src/game/territory-resources.ts|\
              tests/enemy-strategy-viii-c.test.cjs|\
              tests/engine.test.cjs|\
              tests/logistics-priorities-viii-b4d.test.cjs|\
              tests/supply-throughput-viii-b3.test.cjs|\
              tests/wp2-logistics-resilience.test.cjs)
                continue
                ;;
            esac
            if git cat-file -e "origin/main:$path" 2>/dev/null; then
              git checkout origin/main -- "$path"
            else
              git rm -f --ignore-unmatch "$path"
            fi
          done < <(git diff --name-only origin/main...HEAD)

          git checkout origin/main -- .github/workflows/current-engine-balance.yml

      - name: Commit clean WP2 diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "WP2: keep only logistics model changes"
          git push origin HEAD:agent/wp2-logistics-defeat-model
