name: Current engine balance simulation

on:
  pull_request:
    paths:
      - 'src/game/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/current-engine-balance.yml'

permissions:
  contents: write

jobs:
  repair-balance-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tuning branch
        uses: actions/checkout@v4
        with:
          ref: agent/current-engine-balance-tuning
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore known-good strategic response baseline
        run: |
          git fetch origin main
          git checkout origin/main -- src/game/strategic-response.ts tests/strategic-response-viii-a.test.cjs

      - name: Apply intended balance delta
        run: node scripts/rebuild-strategic-response-balance.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run regression suite
        run: npm test

      - name: Build game
        run: npm run build

      - name: Commit repaired implementation and restore normal workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout origin/main -- .github/workflows/current-engine-balance.yml
          git rm -f .github/workflows/rebuild-strategic-response-balance.yml || true
          git rm -f scripts/rebuild-strategic-response-balance.mjs || true
          git add src/game/strategic-response.ts tests/strategic-response-viii-a.test.cjs .github/workflows/current-engine-balance.yml
          git commit -m "Repair strategic response balance integration"
          git push origin HEAD:agent/current-engine-balance-tuning
