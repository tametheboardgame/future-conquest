name: Apply tutorial explanation pass

on:
  push:
    branches:
      - agent/improve-logistics-intelligence-tutorial
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tutorial-explanation-builder
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tutorial branch
        uses: actions/checkout@v4
        with:
          ref: agent/improve-logistics-intelligence-tutorial
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply tutorial improvements
        run: node scripts/run-tutorial-explanation-pass.mjs
      - name: Install dependencies
        run: npm ci
      - name: Run regression suite
        run: npm test
      - name: Build production game
        run: npm run build
      - name: Commit validated source
        run: |
          rm .github/workflows/apply-tutorial-explanation-pass.yml
          rm scripts/apply-tutorial-explanation-pass.mjs
          rm scripts/run-tutorial-explanation-pass.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs .github scripts
          git commit -m "Improve Logistics and Intelligence tutorial"
          git push origin HEAD:agent/improve-logistics-intelligence-tutorial
