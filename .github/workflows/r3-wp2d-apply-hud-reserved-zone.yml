name: Apply R3 WP2D HUD reserved zone

on:
  push:
    branches:
      - agent/r3-wp2d-terrain-refinement
    paths:
      - 'scripts/apply-r3-wp2d-hud-reserved-zone.mjs'
      - '.github/workflows/r3-wp2d-apply-hud-reserved-zone.yml'

permissions:
  contents: write

jobs:
  apply-hud-reserved-zone:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r3-wp2d-terrain-refinement
          fetch-depth: 0
      - name: Apply HUD reserved-zone wiring
        run: node scripts/apply-r3-wp2d-hud-reserved-zone.mjs
      - name: Commit HUD reserved-zone wiring
        run: |
          git add src/presentation/r3-terrain-operational-markers.ts
          if git diff --cached --quiet; then
            echo 'HUD reserved-zone wiring already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Reserve terrain HUD space during marker declutter'
          git push origin HEAD:agent/r3-wp2d-terrain-refinement
