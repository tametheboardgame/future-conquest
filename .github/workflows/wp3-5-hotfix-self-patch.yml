name: WP3.5 hotfix self patch

on:
  push:
    branches:
      - agent/wp3-5-production-fallback-hotfix
    paths:
      - '.github/workflows/wp3-5-hotfix-self-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wp3-5-production-fallback-hotfix
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded source patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          impl = Path('src/components/TerrainMapPrototypeImpl.tsx')
          text = impl.read_text()
          old = """        if (nextMode !== terrainMeshMode) {
          map.setTerrain(nextMode === 'physical' ? {
            source: 'r3-wp2b-terrain-dem',
            exaggeration: terrainExaggerationForProfile(presentationProfile)
          } : null);
          terrainMeshMode = nextMode;
        }
"""
          new = """        if (nextMode !== terrainMeshMode) {
          // Keep the DEM source attached in Theatre so MapLibre can retain its
          // terrain tile cache across Theatre -> Campaign/Selected transitions.
          // Zero exaggeration gives the required strategic-flat presentation
          // without tearing terrain down and forcing the same DEM tiles to be
          // requested again when physical relief returns.
          map.setTerrain({
            source: 'r3-wp2b-terrain-dem',
            exaggeration: nextMode === 'physical'
              ? terrainExaggerationForProfile(presentationProfile)
              : 0
          });
          terrainMeshMode = nextMode;
        }
"""
          if old in text:
              impl.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('Terrain mesh patch target not found')

          probe = Path('scripts/run-r3-wp2f-visual-runtime.mjs')
          text = probe.read_text()
          old = """for (const [button, expected, file] of [['theatre', 'theatre', 'theatre.png'], ['campaign', 'campaign', 'campaign.png'], ['selected', 'local', 'selected-local.png']]) {
  const control = page.getByRole('button', { name: button, exact: true });
  if (button === 'selected' && await control.isDisabled()) await page.locator('.r3-terrain-territory-label').first().click();
  await control.click();
"""
          new = """const activateCamera = async name => {
  const control = page.getByRole('button', { name, exact: true });
  await control.waitFor({ state: 'visible' });
  if (name === 'selected' && await control.isDisabled()) {
    await page.locator('.r3-terrain-territory-label').first().click({ force: true });
    await page.waitForFunction(cameraName => {
      const button = [...document.querySelectorAll('.r3-terrain-prototype-toolbar button')]
        .find(element => element.textContent?.trim() === cameraName);
      return button instanceof HTMLButtonElement && !button.disabled;
    }, name);
  }
  // WP2F owns settled visual-state assertions, not Playwright pointer
  // actionability. Dedicated interaction/selection gates exercise user clicks.
  await page.evaluate(cameraName => {
    const button = [...document.querySelectorAll('.r3-terrain-prototype-toolbar button')]
      .find(element => element.textContent?.trim() === cameraName);
    if (!(button instanceof HTMLButtonElement) || button.disabled) {
      throw new Error(`Camera control ${cameraName} is unavailable.`);
    }
    button.click();
  }, name);
};

for (const [button, expected, file] of [['theatre', 'theatre', 'theatre.png'], ['campaign', 'campaign', 'campaign.png'], ['selected', 'local', 'selected-local.png']]) {
  await activateCamera(button);
"""
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('WP2F primary camera patch target not found')

          old2 = "await page.getByRole('button', { name: 'campaign', exact: true }).click();"
          new2 = "await activateCamera('campaign');"
          if old2 in text:
              text = text.replace(old2, new2, 1)
          elif new2 not in text:
              raise SystemExit('WP2F Layers camera patch target not found')
          probe.write_text(text)
          PY
      - name: Commit patch if needed
        run: |
          if git diff --quiet; then
            echo 'Patch already present.'
            exit 0
          fi
          git config user.name 'Future Conquest Supervisor'
          git config user.email 'actions@users.noreply.github.com'
          git add src/components/TerrainMapPrototypeImpl.tsx scripts/run-r3-wp2f-visual-runtime.mjs
          git commit -m 'Retain terrain cache across strategic camera transitions'
          git push origin HEAD:agent/wp3-5-production-fallback-hotfix
