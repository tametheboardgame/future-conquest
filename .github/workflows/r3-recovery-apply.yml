name: Apply R3 production coherence recovery

on:
  push:
    branches:
      - agent/r3-production-coherence-recovery
    paths:
      - '.github/workflows/r3-recovery-apply.yml'

permissions:
  contents: write

jobs:
  apply-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: agent/r3-production-coherence-recovery
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply controlled recovery patch
        run: node scripts/apply-r3-production-recovery.mjs
      - name: Install dependencies
        run: npm ci
      - name: Run full regression suite
        run: npm test
      - name: Build production game
        run: npm run build
      - name: Keep workflow mutation out of the automated commit
        run: rm -f .github/workflows/r3-production-default-terrain.yml
      - name: Commit validated source changes only
        run: |
          git config user.name 'Future Conquest Recovery Supervisor'
          git config user.email 'actions@users.noreply.github.com'
          git add src/App.tsx tests/r3-production-coherence.test.cjs scripts/run-r3-production-default-runtime.mjs
          git diff --cached --check
          git commit -m 'R3 recovery: make terrain and WP3 the production default'
          git push origin HEAD:agent/r3-production-coherence-recovery
# connector will install the permanent workflow and remove one-shot machinery after this succeeds
