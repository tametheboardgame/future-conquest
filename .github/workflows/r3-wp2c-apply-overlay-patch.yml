name: R3 WP2C apply overlay patch

on:
  push:
    branches:
      - agent/r3-wp2c-terrain-overlay-parity
    paths:
      - 'scripts/apply-r3-wp2c-overlay-patch.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/r3-wp2c-terrain-overlay-parity
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply deterministic overlay patch
        run: node scripts/apply-r3-wp2c-overlay-patch.mjs
      - name: Commit patched renderer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/TerrainMapPrototypeImpl.tsx src/r3-terrain-prototype.css
          git diff --cached --quiet && exit 0
          git commit -m "Wire operational markers over terrain renderer"
          git push origin HEAD:agent/r3-wp2c-terrain-overlay-parity
