name: WP11 apply harness modernisation

on:
  push:
    branches:
      - agent/wp11-balance-playtest-followup

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[wp11-harness-modernised]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/wp11-balance-playtest-followup
          fetch-depth: 0

      - name: Apply balance harness modernisation
        run: python3 scripts/wp11-modernise-balance-harness.py

      - name: Commit modernised harness
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/balance-simulation.ts scripts/trace-current-engine-balance.mjs
          if git diff --cached --quiet; then
            echo "No harness patch required"
            exit 0
          fi
          git commit -m "WP11: modernise balance harness doctrine [wp11-harness-modernised]"
          git push origin HEAD:agent/wp11-balance-playtest-followup
