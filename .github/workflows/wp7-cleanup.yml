name: WP7 generated artefact cleanup

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WP7 branch
        uses: actions/checkout@v4
        with:
          ref: agent/wp7-engineering-infrastructure-clarity
          fetch-depth: 0

      - name: Restore all non-WP7 files from main
        shell: bash
        run: |
          set -euo pipefail
          allowed() {
            case "$1" in
              src/App.tsx|src/components/CommandNavigation.tsx|src/components/InfrastructureCommand.tsx|src/infrastructure-command.css|src/main.tsx|tests/interdiction-viii-b4c.test.cjs|tests/wp7-infrastructure-command-clarity.test.cjs)
                return 0 ;;
              *) return 1 ;;
            esac
          }

          while IFS= read -r file; do
            if allowed "$file"; then
              continue
            fi
            if [ "$file" = ".github/workflows/wp7-cleanup.yml" ]; then
              continue
            fi
            if git cat-file -e "origin/main:$file" 2>/dev/null; then
              git checkout origin/main -- "$file"
            else
              rm -f -- "$file"
            fi
          done < <(git diff --name-only origin/main...HEAD)

          rm -f .github/workflows/wp7-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          echo "Final WP7 diff:"
          git diff --cached --name-only
          git commit -m "WP7: remove generated build artefacts"
          git push origin HEAD:agent/wp7-engineering-infrastructure-clarity
