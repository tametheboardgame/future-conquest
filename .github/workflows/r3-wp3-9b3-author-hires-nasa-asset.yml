name: R3 WP3.9B3 author NASA 500m local terrain tiles

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/maps/build-r3-nasa-physical-terrain-local-tiles.py'
      - '.github/workflows/r3-wp3-9b3-author-hires-nasa-asset.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authoring dependencies
        run: python -m pip install --disable-pip-version-check pillow==11.3.0 numpy==2.2.6
      - name: Download NASA Blue Marble June 500m Europe source tiles
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            --output /tmp/nasa-blue-marble-june-500m-b1.jpg \
            https://assets.science.nasa.gov/content/dam/science/esd/eo/images/bmng/bmng-base/june/world.200406.3x21600x21600.B1.jpg
          curl --fail --location --retry 3 --retry-delay 2 \
            --output /tmp/nasa-blue-marble-june-500m-c1.jpg \
            https://assets.science.nasa.gov/content/dam/science/esd/eo/images/bmng/bmng-base/june/world.200406.3x21600x21600.C1.jpg
          test "$(stat -c%s /tmp/nasa-blue-marble-june-500m-b1.jpg)" -gt 20000000
          test "$(stat -c%s /tmp/nasa-blue-marble-june-500m-c1.jpg)" -gt 20000000
      - name: Build Europe zoom-7 local-detail raster tiles
        run: |
          mkdir -p artifacts/r3-wp3-9b3-local-tiles
          python scripts/maps/build-r3-nasa-physical-terrain-local-tiles.py \
            /tmp/nasa-blue-marble-june-500m-b1.jpg \
            /tmp/nasa-blue-marble-june-500m-c1.jpg \
            artifacts/r3-wp3-9b3-local-tiles/tiles \
            artifacts/r3-wp3-9b3-local-tiles/manifest.json
      - name: Verify candidate tile count and final static cost
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.load(open('artifacts/r3-wp3-9b3-local-tiles/manifest.json', encoding='utf-8'))
          files = list(Path('artifacts/r3-wp3-9b3-local-tiles/tiles/7').glob('*/*.webp'))
          assert manifest['sourceResolution'] == '500 m/pixel'
          assert manifest['tileSize'] == 512
          assert manifest['minzoom'] == 7 and manifest['maxzoom'] == 7
          assert manifest['tileCount'] == 1023, manifest['tileCount']
          assert len(files) == 1023, len(files)
          assert manifest['totalBytes'] == 9338146, manifest['totalBytes']
          assert manifest['contentSha256'] == '7185e1629fd3c65f76eb9b5005eeb7582e8c16cff749ec6be297b7269e0b30d2'
          assert manifest['totalBytes'] < 10 * 1024 * 1024
          print(json.dumps(manifest, indent=2))
          PY
      - name: Commit verified runtime tiles to PR branch
        if: github.event_name == 'pull_request'
        run: |
          rm -rf public/generated/r3-terrain/physical-colour-tiles
          mkdir -p public/generated/r3-terrain/physical-colour-tiles
          cp -R artifacts/r3-wp3-9b3-local-tiles/tiles/. public/generated/r3-terrain/physical-colour-tiles/
          cp artifacts/r3-wp3-9b3-local-tiles/manifest.json public/generated/r3-terrain/physical-colour-tiles-manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/generated/r3-terrain/physical-colour-tiles public/generated/r3-terrain/physical-colour-tiles-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'WP3.9B3 package NASA 500m local terrain tiles'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Upload 500m local-detail evidence
        uses: actions/upload-artifact@v4
        with:
          name: r3-wp3-9b3-500m-local-tiles-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/r3-wp3-9b3-local-tiles/
          if-no-files-found: error
          retention-days: 7
