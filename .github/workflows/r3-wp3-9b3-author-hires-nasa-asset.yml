name: R3 WP3.9B3 author high-resolution NASA terrain asset

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/maps/build-r3-hires-nasa-physical-terrain-texture.py'
      - '.github/workflows/r3-wp3-9b3-author-hires-nasa-asset.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authoring dependencies
        run: python -m pip install --disable-pip-version-check pillow==11.3.0 numpy==2.2.6
      - name: Download NASA Blue Marble June 2 km composite
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            --output /tmp/nasa-blue-marble-june-2km.jpg \
            https://assets.science.nasa.gov/content/dam/science/esd/eo/images/bmng/bmng-base/june/world.200406.3x21600x10800.jpg
          test "$(stat -c%s /tmp/nasa-blue-marble-june-2km.jpg)" -gt 15000000
      - name: Build projected high-resolution Europe physical colour
        run: |
          mkdir -p artifacts/r3-wp3-9b3-nasa
          python scripts/maps/build-r3-hires-nasa-physical-terrain-texture.py \
            /tmp/nasa-blue-marble-june-2km.jpg \
            artifacts/r3-wp3-9b3-nasa/europe-physical-colour-v2.webp \
            artifacts/r3-wp3-9b3-nasa/europe-physical-colour-v2.json
          test -s artifacts/r3-wp3-9b3-nasa/europe-physical-colour-v2.webp
          test "$(stat -c%s artifacts/r3-wp3-9b3-nasa/europe-physical-colour-v2.webp)" -lt 3000000
      - name: Verify authored dimensions and provenance
        run: |
          python - <<'PY'
          import json
          from PIL import Image
          metadata = json.load(open('artifacts/r3-wp3-9b3-nasa/europe-physical-colour-v2.json', encoding='utf-8'))
          image = Image.open('artifacts/r3-wp3-9b3-nasa/europe-physical-colour-v2.webp')
          assert image.size == (2048, 2192), image.size
          assert metadata['dimensions'] == [2048, 2192]
          assert metadata['sourceResolution'].startswith('2 km/pixel')
          assert metadata['runtimeBytes'] > 37032
          print(metadata)
          PY
      - name: Upload authoring evidence
        uses: actions/upload-artifact@v4
        with:
          name: r3-wp3-9b3-nasa-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/r3-wp3-9b3-nasa/
          if-no-files-found: error
          retention-days: 7
