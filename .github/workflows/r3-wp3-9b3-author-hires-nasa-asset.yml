name: R3 WP3.9B3 author high-resolution NASA terrain asset

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/maps/build-r3-hires-nasa-physical-terrain-texture.py'
      - '.github/workflows/r3-wp3-9b3-author-hires-nasa-asset.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authoring dependencies
        run: python -m pip install --disable-pip-version-check pillow==11.3.0 numpy==2.2.6
      - name: Download NASA Blue Marble June 2 km composite
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            --output /tmp/nasa-blue-marble-june-2km.jpg \
            https://assets.science.nasa.gov/content/dam/science/esd/eo/images/bmng/bmng-base/june/world.200406.3x21600x10800.jpg
          test "$(stat -c%s /tmp/nasa-blue-marble-june-2km.jpg)" -gt 15000000
      - name: Build projected high-resolution Europe physical colour
        run: |
          mkdir -p artifacts/r3-wp3-9b3-nasa
          python scripts/maps/build-r3-hires-nasa-physical-terrain-texture.py \
            /tmp/nasa-blue-marble-june-2km.jpg \
            artifacts/r3-wp3-9b3-nasa/europe-physical-colour-v2.webp \
            artifacts/r3-wp3-9b3-nasa/europe-physical-colour-v2.json
          test -s artifacts/r3-wp3-9b3-nasa/europe-physical-colour-v2.webp
          test "$(stat -c%s artifacts/r3-wp3-9b3-nasa/europe-physical-colour-v2.webp)" -lt 3000000
      - name: Verify authored dimensions and provenance
        run: |
          python - <<'PY'
          import json
          from PIL import Image
          metadata = json.load(open('artifacts/r3-wp3-9b3-nasa/europe-physical-colour-v2.json', encoding='utf-8'))
          image = Image.open('artifacts/r3-wp3-9b3-nasa/europe-physical-colour-v2.webp')
          assert image.size == (2048, 2192), image.size
          assert metadata['dimensions'] == [2048, 2192]
          assert metadata['sourceResolution'].startswith('2 km/pixel')
          assert metadata['runtimeBytes'] == 396994, metadata['runtimeBytes']
          assert metadata['sha256'] == 'f6257502818ac444c64fc94897f9fcfecfddd3e5525f00880a06b48e49577af4'
          print(metadata)
          PY
      - name: Package deterministic runtime source
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import base64
          import json
          import math
          from pathlib import Path

          image_path = Path('artifacts/r3-wp3-9b3-nasa/europe-physical-colour-v2.webp')
          metadata_path = Path('artifacts/r3-wp3-9b3-nasa/europe-physical-colour-v2.json')
          source_dir = Path('src/assets/r3-wp3-9b3-physical-terrain')
          committed_metadata = Path('public/generated/r3-terrain/europe-physical-colour-v2.json')

          encoded = base64.b64encode(image_path.read_bytes()).decode('ascii')
          chunk_size = math.ceil(len(encoded) / 4 / 4) * 4
          parts = [encoded[offset:offset + chunk_size] for offset in range(0, len(encoded), chunk_size)]
          assert len(parts) == 4, len(parts)

          source_dir.mkdir(parents=True, exist_ok=True)
          for existing in source_dir.glob('part-*.b64'):
              existing.unlink()
          for index, part in enumerate(parts, start=1):
              (source_dir / f'part-{index:02}.b64').write_text(part + '\n', encoding='utf-8')

          metadata = json.loads(metadata_path.read_text(encoding='utf-8'))
          metadata['buildEncoding'] = 'four base64 chunks materialised locally'
          committed_metadata.parent.mkdir(parents=True, exist_ok=True)
          committed_metadata.write_text(json.dumps(metadata, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/assets/r3-wp3-9b3-physical-terrain public/generated/r3-terrain/europe-physical-colour-v2.json
          if ! git diff --cached --quiet; then
            git commit -m 'WP3.9B3 package high-resolution terrain asset'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Upload authoring evidence
        uses: actions/upload-artifact@v4
        with:
          name: r3-wp3-9b3-nasa-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/r3-wp3-9b3-nasa/
          if-no-files-found: error
          retention-days: 7
