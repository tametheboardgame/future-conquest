name: R3 WP3.9B3 verify NASA 500m local terrain tiles

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/maps/build-r3-nasa-physical-terrain-local-tiles.py'
      - 'public/generated/r3-terrain/physical-colour-tiles-manifest.json'
      - '.github/workflows/r3-wp3-9b3-author-hires-nasa-asset.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authoring dependencies
        run: python -m pip install --disable-pip-version-check pillow==11.3.0 numpy==2.2.6
      - name: Download NASA Blue Marble June 500m Europe source tiles
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            --output /tmp/nasa-blue-marble-june-500m-b1.jpg \
            https://assets.science.nasa.gov/content/dam/science/esd/eo/images/bmng/bmng-base/june/world.200406.3x21600x21600.B1.jpg
          curl --fail --location --retry 3 --retry-delay 2 \
            --output /tmp/nasa-blue-marble-june-500m-c1.jpg \
            https://assets.science.nasa.gov/content/dam/science/esd/eo/images/bmng/bmng-base/june/world.200406.3x21600x21600.C1.jpg
      - name: Rebuild exact zoom-7 local-detail raster tiles
        run: |
          mkdir -p artifacts/r3-wp3-9b3-local-tiles
          python scripts/maps/build-r3-nasa-physical-terrain-local-tiles.py \
            /tmp/nasa-blue-marble-june-500m-b1.jpg \
            /tmp/nasa-blue-marble-june-500m-c1.jpg \
            artifacts/r3-wp3-9b3-local-tiles/tiles \
            artifacts/r3-wp3-9b3-local-tiles/manifest.json
      - name: Verify committed runtime tile tree is deterministic
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          authored_manifest = json.load(open('artifacts/r3-wp3-9b3-local-tiles/manifest.json', encoding='utf-8'))
          committed_manifest = json.load(open('public/generated/r3-terrain/physical-colour-tiles-manifest.json', encoding='utf-8'))
          authored = Path('artifacts/r3-wp3-9b3-local-tiles/tiles')
          committed = Path('public/generated/r3-terrain/physical-colour-tiles')
          authored_files = sorted(path.relative_to(authored) for path in authored.rglob('*.webp'))
          committed_files = sorted(path.relative_to(committed) for path in committed.rglob('*.webp'))
          assert authored_manifest == committed_manifest
          assert authored_manifest['tileCount'] == 1023
          assert authored_manifest['totalBytes'] == 9338146
          assert authored_manifest['contentSha256'] == '7185e1629fd3c65f76eb9b5005eeb7582e8c16cff749ec6be297b7269e0b30d2'
          assert authored_files == committed_files
          for relative in authored_files:
              assert authored.joinpath(relative).read_bytes() == committed.joinpath(relative).read_bytes(), relative
          print(json.dumps(committed_manifest, indent=2))
          PY
      - name: Upload regenerated verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: r3-wp3-9b3-500m-verification-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/r3-wp3-9b3-local-tiles/manifest.json
          if-no-files-found: error
          retention-days: 7
