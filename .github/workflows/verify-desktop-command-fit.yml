name: Verify desktop command fit release

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'agent/verify-desktop-command-fit'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout released main commit
        uses: actions/checkout@v4
        with:
          ref: cc52808187b4b5d69c99e200a7bfcc08eea6b0b8

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run released regression suite
        run: npm test

      - name: Build released production bundle
        run: npm run build

      - name: Verify released source markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q "ATTACK ORDER READY" src/App.tsx
          grep -q "Priority operational corridor" src/App.tsx
          grep -q "renderPriorityOrderAction('panel')" src/App.tsx
          grep -q "renderPriorityOrderAction('map')" src/App.tsx
          grep -q "min-height: 720px" src/desktop-command-fit.css
          grep -q "height: 100dvh" src/desktop-command-fit.css
          grep -q "overflow-y: auto" src/desktop-command-fit.css
          test ! -e .github/workflows/apply-desktop-command-fit.yml
          test ! -e scripts/apply-desktop-command-fit.py

      - name: Verify GitHub Pages bundle
        shell: bash
        run: |
          set -euo pipefail
          site='https://tametheboardgame.github.io/future-conquest/'
          success=0

          for attempt in $(seq 1 30); do
            html=$(curl --fail --silent --show-error --location \
              -H 'Cache-Control: no-cache' \
              "${site}?verify_command_fit=${GITHUB_RUN_ID}_${attempt}") || true

            js_path=$(printf '%s' "$html" | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -n 1 || true)
            css_path=$(printf '%s' "$html" | grep -oE 'assets/index-[A-Za-z0-9_-]+\.css' | head -n 1 || true)

            if [[ -n "$js_path" && -n "$css_path" ]]; then
              js=$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${site}${js_path}?verify=${GITHUB_RUN_ID}_${attempt}") || true
              css=$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${site}${css_path}?verify=${GITHUB_RUN_ID}_${attempt}") || true

              if printf '%s' "$js" | grep -q 'ATTACK ORDER READY' \
                && printf '%s' "$js" | grep -q 'Priority operational corridor' \
                && printf '%s' "$css" | grep -q 'priority-order-action' \
                && printf '%s' "$css" | grep -q '100dvh'; then
                echo "Verified live desktop command fit bundles: $js_path and $css_path"
                success=1
                break
              fi
            fi

            echo "Live bundle not updated yet; attempt ${attempt}/30"
            sleep 10
          done

          if [[ "$success" -ne 1 ]]; then
            echo 'Desktop command fit markers were not found in the live GitHub Pages bundle.' >&2
            exit 1
          fi
