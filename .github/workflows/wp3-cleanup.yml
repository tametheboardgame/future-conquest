name: Clean WP3 generated artifacts

on:
  push:
    branches:
      - agent/r2-wp3-territory-resources
    paths:
      - .github/workflows/wp3-cleanup.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r2-wp3-territory-resources
          fetch-depth: 0
      - name: Restore generated files from main
        run: |
          git fetch origin main
          git checkout origin/main -- public/generated src/generated src/assets/motion-comic-v3/page2/bundle-parts-q12/part-08.txt src/assets/motion-comic-v3/page2/bundle-parts-q12/part-09.txt src/assets/motion-comic-v3/page2/bundle-parts-q12/part-10.txt
          rm -f .github/workflows/wp3-cleanup.yml
      - name: Commit clean WP3 diff
        run: |
          git config user.name "future-conquest-supervisor[bot]"
          git config user.email "future-conquest-supervisor[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove generated build noise from WP3"
          git push origin HEAD:agent/r2-wp3-territory-resources
