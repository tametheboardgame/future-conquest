name: WP5 combat reporting validation

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wp5:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout WP5 branch
        uses: actions/checkout@v4
        with:
          ref: agent/wp5-combat-after-action-clarity
          fetch-depth: 0

      - name: Apply WP5 integration
        run: python scripts/wp5-apply.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression suite
        run: npm test

      - name: Build game
        run: npm run build

      - name: Commit validated WP5 implementation
        run: |
          rm scripts/wp5-apply.py .github/workflows/wp5-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/main.tsx src/components/CombatReports.tsx src/combat-reports.css src/game/types.ts src/game/engine.ts src/game/combat-reports.ts tests/wp5-combat-after-action-clarity.test.cjs
          git add -A scripts/wp5-apply.py .github/workflows/wp5-apply.yml
          git status --short
          git commit -m "WP5: make combat outcomes and losses readable"
          git push origin HEAD:agent/wp5-combat-after-action-clarity
