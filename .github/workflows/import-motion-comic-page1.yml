name: Import Motion Comic Page 1 artwork

on:
  push:
    branches:
      - agent/workstream2-page1-hires
    paths:
      - .github/workflows/import-motion-comic-page1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/workstream2-page1-hires
          fetch-depth: 0

      - name: Download production artwork
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://tmpfiles.org/dl/1170824/page1-production-hires.zip' \
            --output /tmp/page1-production-hires.zip
          rm -rf public/generated/motion-comic-v3/page1
          mkdir -p public/generated/motion-comic-v3/page1
          unzip -q /tmp/page1-production-hires.zip -d public/generated/motion-comic-v3/page1

      - name: Validate imported WebP files
        run: |
          set -euo pipefail
          test "$(find public/generated/motion-comic-v3/page1 -maxdepth 1 -name '*.webp' | wc -l)" -eq 6
          for file in public/generated/motion-comic-v3/page1/*.webp; do
            test "$(head -c 4 "$file")" = 'RIFF'
            test "$(dd if="$file" bs=1 skip=8 count=4 status=none)" = 'WEBP'
            test "$(stat -c%s "$file")" -gt 100000
          done
          ls -lh public/generated/motion-comic-v3/page1

      - name: Commit imported artwork
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/generated/motion-comic-v3/page1
          if git diff --cached --quiet; then
            echo 'Artwork already imported.'
            exit 0
          fi
          git commit -m 'Add high-resolution Motion Comic Page 1 artwork'
          git push origin HEAD:agent/workstream2-page1-hires
