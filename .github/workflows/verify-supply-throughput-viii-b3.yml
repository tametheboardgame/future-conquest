name: Verify Phase VIII-B3 release

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'agent/verify-supply-throughput-viii-b3'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout released Phase VIII-B3 commit
        uses: actions/checkout@v4
        with:
          ref: 21bef78757e916ab15dde9f333352adc484e2508

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run released regression suite
        run: npm test

      - name: Build released production bundle
        run: npm run build

      - name: Verify released source markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PHASE VIII-B3 / SUPPLY THROUGHPUT' src/App.tsx
          grep -q 'LOGISTICS NETWORK' src/App.tsx
          grep -q 'future-conquest-slice-v0.8' src/game/engine.ts
          grep -q "label: 'Supply network'" src/components/MapView.tsx
          grep -q 'supply-route-flow' src/components/MapView.tsx
          grep -q 'pointer-events: none' src/supply-network.css
          test ! -e .github/workflows/apply-supply-throughput-viii-b3.yml
          test ! -e scripts/apply-supply-throughput-viii-b3.py

      - name: Verify GitHub Pages bundle
        shell: bash
        run: |
          set -euo pipefail
          site='https://tametheboardgame.github.io/future-conquest/'
          success=0

          for attempt in $(seq 1 36); do
            html=$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${site}?verify_supply_b3=${GITHUB_RUN_ID}_${attempt}") || true
            js_path=$(printf '%s' "$html" | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -n 1 || true)
            css_path=$(printf '%s' "$html" | grep -oE 'assets/index-[A-Za-z0-9_-]+\.css' | head -n 1 || true)

            if [[ -n "$js_path" && -n "$css_path" ]]; then
              js=$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${site}${js_path}?verify=${GITHUB_RUN_ID}_${attempt}") || true
              css=$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${site}${css_path}?verify=${GITHUB_RUN_ID}_${attempt}") || true

              if printf '%s' "$js" | grep -q 'PHASE VIII-B3 / SUPPLY THROUGHPUT' \
                && printf '%s' "$js" | grep -q 'LOGISTICS NETWORK' \
                && printf '%s' "$js" | grep -q 'Supply network' \
                && printf '%s' "$css" | grep -q 'supply-route-flow' \
                && printf '%s' "$css" | grep -q 'logistics-summary-grid'; then
                echo "Verified live Phase VIII-B3 bundles: $js_path and $css_path"
                success=1
                break
              fi
            fi

            echo "Live Phase VIII-B3 bundle not updated yet; attempt ${attempt}/36"
            sleep 10
          done

          if [[ "$success" -ne 1 ]]; then
            echo 'Phase VIII-B3 markers were not found in the live GitHub Pages bundle.' >&2
            exit 1
          fi
