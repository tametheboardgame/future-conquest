name: WP3 balance harness integration

on:
  push:
    branches:
      - agent/wp3-strategic-collapse-choice
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'agent/wp3-strategic-collapse-choice' || github.ref_name == 'agent/wp3-strategic-collapse-choice'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FC_BALANCE_RUNS_PER_START: '1'
      FC_BALANCE_MAX_TURNS: '120'
      FC_BALANCE_SEED_OFFSET: '1'
    steps:
      - name: Checkout WP3 branch
        uses: actions/checkout@v4
        with:
          ref: agent/wp3-strategic-collapse-choice
          fetch-depth: 0

      - name: Apply balance harness integration
        run: node scripts/wp3-harness-fix.mjs

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression suite
        run: npm test

      - name: Run reduced campaign simulation
        run: npm run simulate:current-balance

      - name: Commit harness integration
        run: |
          rm scripts/wp3-harness-fix.mjs .github/workflows/wp3-harness-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/balance-simulation.ts
          git add -A scripts/wp3-harness-fix.mjs .github/workflows/wp3-harness-fix.yml
          git commit -m "WP3: teach balance harness to continue through collapse decisions"
          git push origin HEAD:agent/wp3-strategic-collapse-choice
