name: Apply R3 WP2D non-wrapping world

on:
  push:
    branches:
      - agent/r3-wp2d-terrain-refinement
    paths:
      - 'scripts/apply-r3-wp2d-nonwrapping-world.mjs'
      - '.github/workflows/r3-wp2d-apply-nonwrapping-world.yml'

permissions:
  contents: write

jobs:
  apply-nonwrapping-world:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r3-wp2d-terrain-refinement
          fetch-depth: 0
      - name: Disable world copies
        run: node scripts/apply-r3-wp2d-nonwrapping-world.mjs
      - name: Commit non-wrapping terrain map
        run: |
          git add src/components/TerrainMapPrototypeImpl.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Disable world wrapping on Europe terrain map'
          git push origin HEAD:agent/r3-wp2d-terrain-refinement
