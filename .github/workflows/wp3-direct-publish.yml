name: Publish direct R2-WP3 implementation

on:
  push:
    branches:
      - agent/r2-wp3-territory-resources
    paths:
      - .github/workflows/wp3-direct-publish.yml

permissions:
  contents: write

jobs:
  implement-validate-publish:
    if: ${{ !contains(github.event.head_commit.message, 'feat: implement R2-WP3 directly') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WP3 branch
        uses: actions/checkout@v4
        with:
          ref: agent/r2-wp3-territory-resources
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply WP3 implementation
        run: node scripts/apply-wp3-direct.mjs
      - name: Run full tests
        run: npm test
      - name: Run production build
        run: npm run build
      - name: Run persistence compatibility tests
        run: node --test tests/persistence.test.cjs tests/persistence-ui.test.cjs
      - name: Run deterministic campaign validation
        run: npm run simulate:current-balance -- --runs-per-start=4 --max-turns=120 --output-dir=/tmp/r2-wp3-balance
      - name: Check patch cleanliness
        run: git diff --check
      - name: Publish validated WP3 implementation
        run: |
          git config user.name "future-conquest-supervisor[bot]"
          git config user.email "future-conquest-supervisor[bot]@users.noreply.github.com"
          rm -f scripts/apply-wp3-direct.mjs .github/workflows/wp3-direct-publish.yml
          git add -A
          git commit -m "feat: implement R2-WP3 directly"
          git push origin HEAD:agent/r2-wp3-territory-resources
