name: Run strategic balance tuning sweep

on:
  push:
    branches:
      - agent/current-engine-balance-tuning
    paths:
      - '.github/workflows/run-strategic-balance-sweep.yml'

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/current-engine-balance-tuning
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/run-strategic-balance-sweep.mjs
      - name: Commit selected profile and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/run-strategic-balance-sweep.yml
          git add src/game/strategic-balance.ts balance-pass4-sweep-summary.md scripts/run-strategic-balance-sweep.mjs
          git commit -m "Select strategic balance profile from deterministic sweep"
          git push origin HEAD:agent/current-engine-balance-tuning
