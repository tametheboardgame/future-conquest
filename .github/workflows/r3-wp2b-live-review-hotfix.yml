name: R3 WP2B live review hotfix applicator

on:
  push:
    branches:
      - agent/r3-wp2b-live-terrain-hotfix

permissions:
  contents: write

jobs:
  apply-hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: agent/r3-wp2b-live-terrain-hotfix
      - name: Apply live-review fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}')
              file.write_text(text.replace(old, new, 1))

          replace(
              'src/components/TerrainMapPrototypeImpl.tsx',
              """  return chooseCampaignMapRenderer({\n    webgl: Boolean(canvas.getContext('webgl2')),\n    terrainEnabled: true\n  }) === 'real-terrain';""",
              """  const context = canvas.getContext('webgl2') || canvas.getContext('webgl');\n  return chooseCampaignMapRenderer({\n    webgl: Boolean(context),\n    terrainEnabled: true\n  }) === 'real-terrain';"""
          )

          replace(
              'src/r3-strategic-map.css',
              """.europe-map-frame .map,\n.europe-map-frame .map-controls,\n.europe-map-frame .map-viewport-status {\n  position: relative;\n  z-index: 2;\n}""",
              """.europe-map-frame .map {\n  position: relative;\n  z-index: 2;\n}\n\n/* Preserve the absolute overlay positioning established by europe-map.css.\n   WP2 previously grouped these with the SVG and accidentally changed them to\n   position: relative, allowing the later SVG to paint over the Layers popover. */\n.europe-map-frame .map-controls,\n.europe-map-frame .map-viewport-status {\n  z-index: 6;\n}"""
          )

          replace(
              'src/App.tsx',
              """  const [terrainPrototypeFailed, setTerrainPrototypeFailed] = useState(false);""",
              """  const [terrainPrototypeFailed, setTerrainPrototypeFailed] = useState(false);\n  const [terrainPrototypeFailureReason, setTerrainPrototypeFailureReason] = useState('');"""
          )

          replace(
              'src/App.tsx',
              """            {terrainPrototypeRequested && !terrainPrototypeFailed ? <Suspense fallback={<div className=\"r3-terrain-prototype-loading\" role=\"status\">Loading experimental terrain renderer…</div>}>""",
              """            {terrainPrototypeRequested && terrainPrototypeFailed && <div className=\"r3-terrain-fallback-notice\" role=\"alert\">\n              <span><strong>3D terrain unavailable</strong>{terrainPrototypeFailureReason || 'The terrain renderer returned to the stable 2D map.'}</span>\n              <button type=\"button\" onClick={() => { setTerrainPrototypeFailureReason(''); setTerrainPrototypeFailed(false); }}>Retry terrain</button>\n            </div>}\n            {terrainPrototypeRequested && !terrainPrototypeFailed ? <Suspense fallback={<div className=\"r3-terrain-prototype-loading\" role=\"status\">Loading experimental terrain renderer…</div>}>"""
          )

          replace(
              'src/App.tsx',
              """                  console.warn(`R3 terrain prototype fallback: ${reason}`);\n                  setTerrainPrototypeFailed(true);""",
              """                  console.warn(`R3 terrain prototype fallback: ${reason}`);\n                  setTerrainPrototypeFailureReason(reason);\n                  setTerrainPrototypeFailed(true);"""
          )

          css = Path('src/r3-terrain-prototype.css')
          css.write_text(css.read_text() + """\n\n/* Live-review diagnostic: terrain fallback must be visible rather than silently\n   presenting the SVG map as though the terrain request had been ignored. */\n.r3-terrain-fallback-notice {\n  position: relative;\n  z-index: 8;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 12px;\n  margin: 8px 10px;\n  padding: 8px 10px;\n  border: 1px solid rgba(230, 174, 94, .58);\n  border-radius: 6px;\n  background: rgba(43, 27, 16, .94);\n  color: #f2dfbd;\n  font-size: 11px;\n}\n\n.r3-terrain-fallback-notice span {\n  display: grid;\n  gap: 2px;\n}\n\n.r3-terrain-fallback-notice strong {\n  color: #ffc779;\n  text-transform: uppercase;\n  letter-spacing: .08em;\n}\n\n.r3-terrain-fallback-notice button {\n  flex: 0 0 auto;\n  border: 1px solid #8b6c45;\n  background: #3b2a1b;\n  color: #fff0d2;\n  padding: 5px 8px;\n  cursor: pointer;\n}\n""")

          Path('tests/r3-wp2b-live-review-hotfix.test.cjs').write_text("""const test = require('node:test');\nconst assert = require('node:assert/strict');\nconst fs = require('node:fs');\n\nconst impl = fs.readFileSync('src/components/TerrainMapPrototypeImpl.tsx', 'utf8');\nconst app = fs.readFileSync('src/App.tsx', 'utf8');\nconst strategicCss = fs.readFileSync('src/r3-strategic-map.css', 'utf8');\nconst terrainCss = fs.readFileSync('src/r3-terrain-prototype.css', 'utf8');\n\ntest('WP2B live terrain capability accepts MapLibre WebGL fallback instead of requiring WebGL2 only', () => {\n  assert.match(impl, /canvas\\.getContext\\('webgl2'\\) \\|\\| canvas\\.getContext\\('webgl'\\)/);\n  assert.doesNotMatch(impl, /webgl: Boolean\\(canvas\\.getContext\\('webgl2'\\)\\)/);\n});\n\ntest('WP2B live terrain fallback is visible and retryable during product-owner review', () => {\n  assert.match(app, /terrainPrototypeFailureReason/);\n  assert.match(app, /3D terrain unavailable/);\n  assert.match(app, /Retry terrain/);\n  assert.match(app, /setTerrainPrototypeFailureReason\\(reason\\)/);\n  assert.match(terrainCss, /\\.r3-terrain-fallback-notice/);\n});\n\ntest('R3 map controls preserve absolute overlay positioning and stay above the SVG', () => {\n  assert.doesNotMatch(strategicCss, /\\.europe-map-frame \\.map,\\s*\\n\\.europe-map-frame \\.map-controls,\\s*\\n\\.europe-map-frame \\.map-viewport-status \\{\\s*\\n\\s*position: relative/);\n  assert.match(strategicCss, /\\.europe-map-frame \\.map \\{\\s*\\n\\s*position: relative;\\s*\\n\\s*z-index: 2/);\n  assert.match(strategicCss, /\\.europe-map-frame \\.map-controls,[\\s\\S]*\\.europe-map-frame \\.map-viewport-status \\{\\s*\\n\\s*z-index: 6/);\n});\n""")
          PY
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/TerrainMapPrototypeImpl.tsx src/App.tsx src/r3-strategic-map.css src/r3-terrain-prototype.css tests/r3-wp2b-live-review-hotfix.test.cjs
          git commit -m 'Fix live terrain fallback and map layer stacking'
          git push origin HEAD:agent/r3-wp2b-live-terrain-hotfix
