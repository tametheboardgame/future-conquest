name: Apply compact map confirmation

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/compact-map-confirmation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/compact-map-confirmation
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply compact map confirmation
        run: python3 scripts/apply-compact-map-confirmation.py

      - name: Install dependencies
        run: npm ci

      - name: Run regression suite
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Commit validated correction
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply-compact-map-confirmation.py .github/workflows/apply-compact-map-confirmation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: anchor compact operation confirmation to map target"
          git push origin HEAD:agent/compact-map-confirmation
