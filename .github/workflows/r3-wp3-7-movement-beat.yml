name: R3 WP3.7 end-of-day movement beat gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/App.tsx'
      - 'src/presentation/r3-formation-*.ts'
      - 'scripts/probe-r3-wp3-7-movement-beat.mjs'
      - 'tests/r3-wp3-7-end-day-movement.test.cjs'
      - '.github/workflows/r3-wp3-7-movement-beat.yml'

permissions:
  contents: read

jobs:
  movement-beat-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile deterministic game fixture
        run: npx tsc -p tsconfig.test.json
      - name: Build production game
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Probe End Day movement beat
        run: node scripts/probe-r3-wp3-7-movement-beat.mjs 2>&1 | tee wp3-7-browser.log
      - name: Upload WP3.7 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-wp3-7-movement-beat-${{ github.event.pull_request.head.sha }}
          path: |
            wp3-7-browser.log
            wp3-7-movement-mid.png
            wp3-7-movement-after.png
          if-no-files-found: warn
