name: R3 WP2 final validation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/r3-wp2-final-gate.yml

permissions:
  contents: read

jobs:
  validate-wp2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run complete repository tests
        run: npm test
      - name: Run R3 renderer preparation benchmark
        run: npm run benchmark:r3-renderer
      - name: Run canonical current-engine balance simulation
        run: npm run simulate:current-balance
      - name: Check patch whitespace
        run: git diff --check HEAD
      - name: Build production game
        run: npm run build
