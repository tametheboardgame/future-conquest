name: R3 WP2C wire group selection

on:
  push:
    branches:
      - agent/r3-wp2c-terrain-overlay-parity
    paths:
      - 'scripts/apply-r3-wp2c-group-selection.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/r3-wp2c-terrain-overlay-parity
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply deterministic group-selection patch
        run: node scripts/apply-r3-wp2c-group-selection.mjs
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/TerrainMapPrototypeImpl.tsx tests/r3-wp2c-terrain-overlay-parity.test.cjs .github/workflows/r3-wp2c-overlay-runtime-probe.yml
          git diff --cached --quiet && exit 0
          git commit -m "Restore formation selection on terrain counters"
          git push origin HEAD:agent/r3-wp2c-terrain-overlay-parity
