name: WP3 strategic collapse validation

on:
  push:
    branches:
      - agent/wp3-strategic-collapse-choice
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wp3:
    if: github.head_ref == 'agent/wp3-strategic-collapse-choice' || github.ref_name == 'agent/wp3-strategic-collapse-choice'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout WP3 branch
        uses: actions/checkout@v4
        with:
          ref: agent/wp3-strategic-collapse-choice
          fetch-depth: 0

      - name: Apply WP3 implementation
        run: node scripts/wp3-apply.mjs

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression suite
        run: npm test

      - name: Build game
        run: npm run build

      - name: Commit validated WP3 implementation
        run: |
          rm scripts/wp3-apply.mjs .github/workflows/wp3-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/types.ts src/game/engine.ts src/App.tsx src/components/StrategicCollapseDecision.tsx src/components/strategic-collapse.css tests/wp3-strategic-collapse.test.cjs
          git add -A scripts/wp3-apply.mjs .github/workflows/wp3-apply.yml
          git status --short
          git commit -m "WP3: make strategic collapse a command decision"
          git push origin HEAD:agent/wp3-strategic-collapse-choice
