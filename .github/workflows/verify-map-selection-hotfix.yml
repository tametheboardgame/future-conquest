name: Verify map selection hotfix live release

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'agent/verify-map-selection-hotfix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout released main commit
        uses: actions/checkout@v4
        with:
          ref: 60f44f182cd070ee67905903d84265b53a4557e3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run released regression suite
        run: npm test

      - name: Build released production bundle
        run: npm run build

      - name: Verify released source and local bundle
        shell: bash
        run: |
          set -euo pipefail
          grep -q "const dragDistance = Math.abs(deltaX) + Math.abs(deltaY)" src/components/MapView.tsx
          grep -q "Interactive map targets must remain above decorative SVG overlays" src/europe-map.css
          grep -q "assets/index-DmOew4ti.js" dist/index.html
          grep -q "assets/index--Vl1c12o.css" dist/index.html

      - name: Verify GitHub Pages bundle
        shell: bash
        run: |
          set -euo pipefail
          site='https://tametheboardgame.github.io/future-conquest/'
          expected_js='assets/index-DmOew4ti.js'
          expected_css='assets/index--Vl1c12o.css'
          success=0

          for attempt in $(seq 1 30); do
            html=$(curl --fail --silent --show-error --location \
              -H 'Cache-Control: no-cache' \
              "${site}?verify_map_selection=${GITHUB_RUN_ID}_${attempt}") || true

            if printf '%s' "$html" | grep -q "$expected_js" \
              && printf '%s' "$html" | grep -q "$expected_css"; then
              css=$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${site}${expected_css}?verify=${GITHUB_RUN_ID}_${attempt}") || true
              if printf '%s' "$css" | grep -q 'task-group-marker' \
                && printf '%s' "$css" | grep -q 'pointer-events:all'; then
                echo "Verified live hotfix bundles: $expected_js and $expected_css"
                success=1
                break
              fi
            fi

            echo "Live bundle not updated yet; attempt ${attempt}/30"
            sleep 10
          done

          if [[ "$success" -ne 1 ]]; then
            echo 'Map selection hotfix was not found in the live GitHub Pages bundles.' >&2
            exit 1
          fi
