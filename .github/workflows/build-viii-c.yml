name: Build Phase VIII-C

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build:
    if: github.head_ref == 'agent/enemy-strategy-balance-viii-c' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/enemy-strategy-balance-viii-c
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply Phase VIII-C implementation
        run: python scripts/apply-viii-c.py

      - name: Install dependencies
        run: npm ci

      - name: Type-check test build
        run: npx tsc -p tsconfig.test.json --pretty false

      - name: Run regression suite
        run: |
          set +e
          npm test > /tmp/test.log 2>&1
          status=$?
          grep -n -A45 -B12 "not ok" /tmp/test.log || true
          tail -n 35 /tmp/test.log
          exit $status

      - name: Build production bundle
        run: npm run build

      - name: Commit implementation
        run: |
          rm scripts/apply-viii-c.py .github/workflows/build-viii-c.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add adaptive enemy strategy"
          git push origin HEAD:agent/enemy-strategy-balance-viii-c
