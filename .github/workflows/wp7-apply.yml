name: WP7 infrastructure command validation

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wp7:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout WP7 branch
        uses: actions/checkout@v4
        with:
          ref: agent/wp7-engineering-infrastructure-clarity
          fetch-depth: 0

      - name: Apply WP7 integration
        run: python scripts/wp7-apply.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression suite
        run: npm test

      - name: Build game
        run: npm run build

      - name: Commit validated WP7 implementation
        run: |
          rm scripts/wp7-apply.py .github/workflows/wp7-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "WP7: make infrastructure actions understandable"
          git push origin HEAD:agent/wp7-engineering-infrastructure-clarity
