name: Apply Phase VIII-A strategic response

on:
  push:
    branches:
      - agent/escalation-mobilisation-viii-a

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Trigger Phase VIII-A builder'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/escalation-mobilisation-viii-a
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply engine and interface integration
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const replaceOnce = (source, before, after, label) => {
            if (!source.includes(before)) throw new Error(`Could not locate ${label}`);
            return source.replace(before, after);
          };
          const replaceRegex = (source, pattern, after, label) => {
            if (!pattern.test(source)) throw new Error(`Could not locate ${label}`);
            return source.replace(pattern, after);
          };
          const fromB64 = value => Buffer.from(value, 'base64').toString('utf8');

          let engine = fs.readFileSync('src/game/engine.ts', 'utf8');
          engine = replaceOnce(
            engine,
            "import { occupationRequirement } from './formation-organisation';",
            "import { occupationRequirement } from './formation-organisation';\nimport { completeEnemyOrder, createStrategicState, getPlannedCounterattack, resolveStrategicResponse, upgradeStrategicState } from './strategic-response';",
            'strategic response imports'
          );
          engine = replaceOnce(
            engine,
            "const SAVE_KEY = 'future-conquest-slice-v0.4';\nconst LEGACY_V3_SAVE_KEY = 'future-conquest-slice-v0.3';",
            "const SAVE_KEY = 'future-conquest-slice-v0.5';\nconst LEGACY_V4_SAVE_KEY = 'future-conquest-slice-v0.4';\nconst LEGACY_V3_SAVE_KEY = 'future-conquest-slice-v0.3';",
            'save keys'
          );
          engine = replaceOnce(
            engine,
            '  const state: GameState = {',
            "  const initialEscalation = difficulty === 'hard' ? 8 : 3;\n  const strategicState = createStrategicState(seed, difficulty, initialEscalation);\n  const state: GameState = {",
            'new-game strategic state'
          );
          engine = replaceOnce(engine, '    version: 4,\n    seed,', '    version: 5,\n    seed,', 'new-game version');
          engine = replaceOnce(
            engine,
            "    escalation: difficulty === 'hard' ? 8 : 3,\n    supply: 100,",
            "    escalation: initialEscalation,\n    ...strategicState,\n    supply: 100,",
            'new-game escalation fields'
          );
          engine = replaceOnce(
            engine,
            "function resolveCounterattack(state: GameState, forced = false): GameState {\n  if (state.turn < 4) return state;\n  const chance = (0.055 + state.escalation / 620) * difficultyRules[state.difficulty].counter;\n  if (!forced && randomFor(state.seed, state.turn, 907) >= chance) return state;",
            "function resolveCounterattack(state: GameState, forced = false): GameState {\n  const plannedCounterattack = getPlannedCounterattack(state);\n  if (state.turn < 4 && !plannedCounterattack) return state;\n  const chance = (0.055 + state.escalation / 620) * difficultyRules[state.difficulty].counter;\n  if (!forced && !plannedCounterattack && randomFor(state.seed, state.turn, 907) >= chance) return state;",
            'planned counterattack entry'
          );
          engine = replaceOnce(
            engine,
            '  const target = frontier[0];',
            "  const target = plannedCounterattack && frontier.includes(plannedCounterattack.target)\n    ? plannedCounterattack.target\n    : frontier[0];",
            'planned counterattack target'
          );
          engine = replaceOnce(
            engine,
            "  formations.sort((a, b) => (b.personnel + b.armour * 4) - (a.personnel + a.armour * 4));\n  const attacker = formations[0];",
            "  formations.sort((a, b) => (b.personnel + b.armour * 4) - (a.personnel + a.armour * 4));\n  const plannedFormation = plannedCounterattack?.formationId ? state.enemyFormations[plannedCounterattack.formationId] : undefined;\n  const attacker = plannedFormation && formations.some(formation => formation.id === plannedFormation.id)\n    ? plannedFormation\n    : formations[0];",
            'planned counterattack formation'
          );
          engine = replaceOnce(
            engine,
            '  return pruneOperations(refreshSupply(next));\n}\n\nexport function endTurn',
            "  if (plannedCounterattack) next = completeEnemyOrder(next, plannedCounterattack.id);\n  return pruneOperations(refreshSupply(next));\n}\n\nexport function endTurn",
            'counterattack completion'
          );
          engine = replaceOnce(engine, '  next = reinforceEnemy(next);', '  next = resolveStrategicResponse(next);', 'strategic response turn phase');
          engine = replaceRegex(
            engine,
            /\n  next\.escalation = clamp\(Math\.max\(3 \+ controlled \* 2\.35, next\.escalation - 0\.08\), 0, 100\);/,
            '',
            'legacy escalation floor'
          );
          const tailIndex = engine.indexOf('interface LegacyBattle {');
          if (tailIndex < 0) throw new Error('Could not locate legacy save tail');
          engine = engine.slice(0, tailIndex) + fromB64('');
          fs.writeFileSync('src/game/engine.ts', engine);

          let feedback = fs.readFileSync('src/persistence-feedback.ts', 'utf8');
          feedback = replaceOnce(feedback, "loaded.source === 'v4'", "loaded.source === 'v5'", 'load-upgrade feedback source');
          fs.writeFileSync('src/persistence-feedback.ts', feedback);

          let app = fs.readFileSync('src/App.tsx', 'utf8');
          app = replaceOnce(
            app,
            "import { occupationRequirement } from './game/formation-organisation';",
            "import { occupationRequirement } from './game/formation-organisation';\nimport { getEscalationStage } from './game/strategic-response';",
            'App strategic response import'
          );
          app = replaceRegex(
            app,
            /  const escalationLabel = state\.escalation[^;]+;/,
            "  const escalationStage = getEscalationStage(state.escalation);\n  const escalationLabel = escalationStage.label;\n  const pendingMobilisations = [...state.mobilisations].filter(project => project.status === 'preparing').sort((a, b) => a.arrivalTurn - b.arrivalTurn);\n  const activeEnemyOrders = state.enemyOrders.filter(order => order.status !== 'completed').slice(0, 8);\n  const intelligenceReports = state.intelligenceReports.slice(0, 10);",
            'App escalation model'
          );
          app = replaceOnce(app, 'PHASE VII-A / COMMAND INTERFACE', 'PHASE VIII-A / STRATEGIC RESPONSE', 'phase eyebrow');
          app = replaceOnce(
            app,
            '<span>Global escalation · {escalationLabel}</span>',
            '<span>Global escalation · Stage {escalationStage.id} · {escalationLabel}</span>',
            'top escalation metric'
          );
          app = replaceRegex(
            app,
            /<section className="view-panel escalation-panel">[\s\S]*?<\/section>\n            <section className="view-panel enemy-summary-panel">/,
            fromB64('') + '\n            <section className="view-panel enemy-summary-panel">',
            'Intelligence escalation panel'
          );
          app = replaceRegex(
            app,
            /(<section className="view-panel enemy-summary-panel">[\s\S]*?<\/section>)\n            <section className="view-panel frontline-panel">/,
            '$1\n' + fromB64('') + '\n            <section className="view-panel frontline-panel">',
            'strategic response Intelligence panels'
          );
          app = replaceOnce(
            app,
            '<div><dt>Status</dt><dd>{state.status}</dd></div>',
            '<div><dt>Status</dt><dd>{state.status}</dd></div><div><dt>Escalation stage</dt><dd>{escalationStage.id} · {escalationLabel}</dd></div><div><dt>Mobilisation reserve</dt><dd>{formatNumber(state.mobilisationPool)}</dd></div>',
            'campaign strategic summary'
          );
          fs.writeFileSync('src/App.tsx', app);

          let readme = fs.readFileSync('README.md', 'utf8');
          if (!readme.includes('Phase VIII-A: Escalation, Mobilisation and Enemy Command')) {
            readme += "\n## Current playable systems\n\n- Phase VIII-A: Escalation, Mobilisation and Enemy Command\n- Five visible escalation stages, reinforcement arrival timelines, assessed enemy intent and confidence-rated intelligence\n- Save version 5 with automatic migration from versions 4, 3 and 2\n\nSee [Phase VIII-A design](docs/design/phase-08-a-strategic-response.md).\n";
          }
          fs.writeFileSync('README.md', readme);

          fs.rmSync('.github/workflows/apply-viii-a-strategic-response.yml');
          fs.rmSync('.viii-a-trigger');
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Run regression suite
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Commit Phase VIII-A
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement escalation mobilisation and enemy command"
          git push origin HEAD:agent/escalation-mobilisation-viii-a
