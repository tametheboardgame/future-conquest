name: Apply map overlay LOD hotfix

on:
  push:
    branches:
      - agent/map-overlay-lod-hotfix

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[map-lod-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: agent/map-overlay-lod-hotfix
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply map overlay patch
        run: python3 .github/scripts/apply-map-overlay-lod-hotfix.py

      - name: Install dependencies
        run: npm ci

      - name: Run regression suite
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Commit validated hotfix and remove temporary builder
        run: |
          rm .github/scripts/apply-map-overlay-lod-hotfix.py
          rm .github/workflows/apply-map-overlay-lod-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/MapView.tsx src/europe-map.css tests/europe-map-platform.test.cjs .github/scripts/apply-map-overlay-lod-hotfix.py .github/workflows/apply-map-overlay-lod-hotfix.yml
          git commit -m "Fix map overlay scaling and zoom detail [map-lod-applied]"
          git push origin HEAD:agent/map-overlay-lod-hotfix
