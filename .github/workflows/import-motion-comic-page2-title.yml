name: Import Motion Comic Page 2 and title artwork

on:
  push:
    branches:
      - agent/workstream2-page2-title-hires
    paths:
      - .github/workflows/import-motion-comic-page2-title.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/workstream2-page2-title-hires
          fetch-depth: 0

      - name: Download production artwork
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://tmpfiles.org/dl/1171554/page2-title-production-hires.zip' \
            --output /tmp/page2-title-production-hires.zip
          rm -rf /tmp/motion-comic-import
          mkdir -p /tmp/motion-comic-import
          unzip -q /tmp/page2-title-production-hires.zip -d /tmp/motion-comic-import
          rm -rf public/generated/motion-comic-v3/page2 public/generated/motion-comic-v3/title
          mkdir -p public/generated/motion-comic-v3/page2 public/generated/motion-comic-v3/title
          mv /tmp/motion-comic-import/panel-0*.webp public/generated/motion-comic-v3/page2/
          mv /tmp/motion-comic-import/panel-1*.webp public/generated/motion-comic-v3/page2/
          mv /tmp/motion-comic-import/title-card-future-conquest.webp public/generated/motion-comic-v3/title/

      - name: Validate imported WebP files
        run: |
          set -euo pipefail
          test "$(find public/generated/motion-comic-v3/page2 -maxdepth 1 -name '*.webp' | wc -l)" -eq 6
          test "$(find public/generated/motion-comic-v3/title -maxdepth 1 -name '*.webp' | wc -l)" -eq 1
          for file in public/generated/motion-comic-v3/page2/*.webp public/generated/motion-comic-v3/title/*.webp; do
            test "$(head -c 4 "$file")" = 'RIFF'
            test "$(dd if="$file" bs=1 skip=8 count=4 status=none)" = 'WEBP'
            test "$(stat -c%s "$file")" -gt 50000
          done
          ls -lh public/generated/motion-comic-v3/page2 public/generated/motion-comic-v3/title

      - name: Commit imported artwork
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/generated/motion-comic-v3/page2 public/generated/motion-comic-v3/title
          if git diff --cached --quiet; then
            echo 'Artwork already imported.'
            exit 0
          fi
          git commit -m 'Add high-resolution Motion Comic Page 2 and title artwork'
          git push origin HEAD:agent/workstream2-page2-title-hires
