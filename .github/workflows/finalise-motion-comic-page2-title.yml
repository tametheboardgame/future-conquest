name: Finalise Motion Comic Page 2 and title integration

on:
  push:
    branches:
      - agent/workstream2-page2-title-hires
    paths:
      - .github/workflows/finalise-motion-comic-page2-title.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalise-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/workstream2-page2-title-hires
          fetch-depth: 0

      - name: Verify imported artwork
        run: |
          set -euo pipefail
          test "$(find public/generated/motion-comic-v3/page2 -maxdepth 1 -name '*.webp' | wc -l)" -eq 6
          test -f public/generated/motion-comic-v3/title/title-card-future-conquest.webp

      - name: Define production asset map
        run: |
          cat > src/assets/motion-comic-v3/panel-assets.ts <<'EOF'
          const panelAsset = (page: 'page1' | 'page2', fileName: string) =>
            `${import.meta.env.BASE_URL}generated/motion-comic-v3/${page}/${fileName}`;

          export const PAGE_1_PANEL_ASSETS: Readonly<Record<string, string>> = {
            'world-that-remains': panelAsset('page1', 'panel-01-world-that-remains.webp'),
            'human-cost': panelAsset('page1', 'panel-02-human-cost.webp'),
            'final-command': panelAsset('page1', 'panel-03-final-command.webp'),
            anomaly: panelAsset('page1', 'panel-04-anomaly.webp'),
            hypothesis: panelAsset('page1', 'panel-05-hypothesis.webp'),
            order: panelAsset('page1', 'panel-06-order.webp')
          };

          export const PAGE_2_PANEL_ASSETS: Readonly<Record<string, string>> = {
            portal: panelAsset('page2', 'panel-07-portal.webp'),
            crossing: panelAsset('page2', 'panel-08-crossing.webp'),
            arrival: panelAsset('page2', 'panel-09-arrival-default.webp'),
            'first-contact': panelAsset('page2', 'panel-10-first-contact.webp'),
            'world-responds': panelAsset('page2', 'panel-11-world-responds.webp'),
            'burden-of-command': panelAsset('page2', 'panel-12-burden-of-command.webp')
          };

          export const TITLE_CARD_ASSET =
            `${import.meta.env.BASE_URL}generated/motion-comic-v3/title/title-card-future-conquest.webp`;
          EOF

      - name: Convert runtime to individual assets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/MotionComicIntro.tsx')
          source = path.read_text()

          def replace(old, new, description, expected=1):
              global source
              count = source.count(old)
              if count != expected:
                  raise SystemExit(f'{description}: expected {expected}, found {count}')
              source = source.replace(old, new, expected)

          replace("import { MOTION_COMIC_SPRITE } from '../assets/motion-comic-v2/sprite';\n", '', 'remove legacy sprite import')
          replace(
              "import { PAGE_1_PANEL_ASSETS } from '../assets/motion-comic-v3/panel-assets';",
              "import {\n  PAGE_1_PANEL_ASSETS,\n  PAGE_2_PANEL_ASSETS,\n  TITLE_CARD_ASSET\n} from '../assets/motion-comic-v3/panel-assets';",
              'expand asset imports'
          )
          replace(
              "  const artworkUrl = useMemo(() => cacheBustedUrl(MOTION_COMIC_SPRITE), []);\n",
              "  const titleArtworkUrl = useMemo(() => cacheBustedUrl(TITLE_CARD_ASSET), []);\n",
              'replace legacy artwork URL'
          )
          replace(
              """  const page1ArtworkUrls = useMemo<Record<string, string>>(\n    () => Object.fromEntries(\n      Object.entries(PAGE_1_PANEL_ASSETS).map(([panelId, assetPath]) => [panelId, cacheBustedUrl(assetPath)])\n    ),\n    []\n  );\n""",
              """  const page1ArtworkUrls = useMemo<Record<string, string>>(\n    () => Object.fromEntries(\n      Object.entries(PAGE_1_PANEL_ASSETS).map(([panelId, assetPath]) => [panelId, cacheBustedUrl(assetPath)])\n    ),\n    []\n  );\n  const page2ArtworkUrls = useMemo<Record<string, string>>(\n    () => Object.fromEntries(\n      Object.entries(PAGE_2_PANEL_ASSETS).map(([panelId, assetPath]) => [panelId, cacheBustedUrl(assetPath)])\n    ),\n    []\n  );\n""",
              'add Page 2 URL map'
          )
          replace(
              '    const assetUrls = [artworkUrl, ...Object.values(page1ArtworkUrls)];',
              """    const assetUrls = [\n      titleArtworkUrl,\n      ...Object.values(page1ArtworkUrls),\n      ...Object.values(page2ArtworkUrls)\n    ];""",
              'preload production assets'
          )
          replace(
              '  }, [artworkUrl, page1ArtworkUrls]);',
              '  }, [page1ArtworkUrls, page2ArtworkUrls, titleArtworkUrl]);',
              'update preload dependencies'
          )
          replace('                src={artworkUrl}', '                src={titleArtworkUrl}', 'use production title image')
          replace(
              """            {activePage === 2 && (\n              <div className=\"motion-comic-page-art\" role=\"img\" aria-label={activePanel?.alt}>\n                <img\n                  className=\"motion-comic-sprite-image motion-comic-page-sprite sprite-page-2\"\n                  src={artworkUrl}\n                  alt=\"\"\n                  aria-hidden=\"true\"\n                  draggable={false}\n                />\n              </div>\n            )}\n""",
              '',
              'remove Page 2 fallback sprite'
          )
          replace(
              '              const panelArtworkUrl = panel.page === 1 ? page1ArtworkUrls[panel.id] : undefined;',
              """              const panelArtworkUrl = panel.page === 1\n                ? page1ArtworkUrls[panel.id]\n                : page2ArtworkUrls[panel.id];""",
              'map both comic pages'
          )
          replace(
              'className="motion-comic-sprite-image motion-comic-title-sprite"',
              'className="motion-comic-title-image"',
              'use independent title image class'
          )

          if 'MOTION_COMIC_SPRITE' in source or 'artworkUrl' in source:
              raise SystemExit('Legacy Motion Comic sprite references remain.')

          path.write_text(source)
          PY

      - name: Add Page 2 and title styling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/motion-comic-panel-assets.css')
          source = path.read_text()
          marker = '/* Workstream 2: individually loaded Page 2 and title artwork. */'
          if marker not in source:
              source += r'''

          /* Workstream 2: individually loaded Page 2 and title artwork. */
          .motion-comic-page.page-2 {
            background: #070b0e;
          }

          .motion-comic-page.page-2 .comic-page-panel {
            overflow: hidden;
            background: #080d11;
          }

          .motion-comic-page.page-2 .panel-portal .motion-comic-panel-art { object-position: 50% 54%; }
          .motion-comic-page.page-2 .panel-crossing .motion-comic-panel-art { object-position: 50% 50%; }
          .motion-comic-page.page-2 .panel-arrival .motion-comic-panel-art { object-position: 50% 54%; }
          .motion-comic-page.page-2 .panel-first-contact .motion-comic-panel-art { object-position: 50% 53%; }
          .motion-comic-page.page-2 .panel-world-responds .motion-comic-panel-art { object-position: 50% 50%; }
          .motion-comic-page.page-2 .panel-burden-of-command .motion-comic-panel-art { object-position: 50% 52%; }

          .motion-comic-title-art {
            overflow: hidden;
          }

          .motion-comic-title-image {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 50% 50%;
            filter: saturate(.97) contrast(1.035) brightness(.92);
            transform: scale(1.005);
            animation: title-card-push 10s ease-out both;
            pointer-events: none;
            user-select: none;
          }

          .motion-comic-title-card .title-card-atmosphere { z-index: 2; }
          .motion-comic-title-card .motion-comic-beat,
          .motion-comic-title-card .motion-comic-begin { z-index: 4; }

          @media (prefers-reduced-motion: reduce) {
            .motion-comic-title-image {
              animation: none;
              transform: scale(1.005);
            }
          }
          '''
          path.write_text(source)
          PY

      - name: Remove one-time workflows
        run: |
          rm -f .github/workflows/import-motion-comic-page2-title.yml
          rm -f .github/workflows/finalise-motion-comic-page2-title.yml

      - name: Commit integration
        run: |
          set -euo pipefail
          grep -q 'PAGE_2_PANEL_ASSETS' src/components/MotionComicIntro.tsx
          grep -q 'TITLE_CARD_ASSET' src/components/MotionComicIntro.tsx
          test -z "$(grep -n 'MOTION_COMIC_SPRITE\|artworkUrl' src/components/MotionComicIntro.tsx || true)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/assets/motion-comic-v3/panel-assets.ts \
            src/components/MotionComicIntro.tsx \
            src/components/motion-comic-panel-assets.css \
            .github/workflows
          git commit -m 'Render Page 2 and title from high-resolution artwork'
          git push origin HEAD:agent/workstream2-page2-title-hires
