name: Fast-publish direct R2-WP3 implementation

on:
  push:
    branches:
      - agent/r2-wp3-territory-resources
    paths:
      - .github/workflows/wp3-apply-fast.yml

permissions:
  contents: write

jobs:
  apply-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r2-wp3-territory-resources
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-wp3-direct.mjs
      - run: npm test
      - run: npm run build
      - run: git diff --check
      - name: Publish
        run: |
          git config user.name "future-conquest-supervisor[bot]"
          git config user.email "future-conquest-supervisor[bot]@users.noreply.github.com"
          rm -f scripts/apply-wp3-direct.mjs .github/workflows/wp3-direct-publish.yml .github/workflows/wp3-apply-fast.yml
          git add -A
          git commit -m "feat: implement R2-WP3 directly"
          git push origin HEAD:agent/r2-wp3-territory-resources
