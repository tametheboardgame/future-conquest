name: Apply R3 WP2D continuous land mask

on:
  push:
    branches:
      - agent/r3-wp2d-terrain-refinement
    paths:
      - 'scripts/apply-r3-wp2d-continuous-land-mask.mjs'
      - '.github/workflows/r3-wp2d-apply-continuous-land-mask.yml'

permissions:
  contents: write

jobs:
  apply-continuous-land-mask:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r3-wp2d-terrain-refinement
          fetch-depth: 0
      - name: Apply continuous land mask
        run: node scripts/apply-r3-wp2d-continuous-land-mask.mjs
      - name: Commit continuous land mask
        run: |
          git add src/components/TerrainMapPrototypeImpl.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use continuous World Atlas land mask'
          git push origin HEAD:agent/r3-wp2d-terrain-refinement
