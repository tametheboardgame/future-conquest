name: R3 WP3.7 branch patch helper

on:
  push:
    branches:
      - agent/r3-wp3-7-end-of-day-movement
    paths:
      - scripts/apply-r3-wp3-7-app-patch.mjs

permissions:
  contents: write

jobs:
  patch-app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout WP3.7 branch
        uses: actions/checkout@v4
        with:
          ref: agent/r3-wp3-7-end-of-day-movement
          fetch-depth: 0
      - name: Apply deterministic App patch
        run: node scripts/apply-r3-wp3-7-app-patch.mjs
      - name: Commit patched App
        shell: bash
        run: |
          if git diff --quiet -- src/App.tsx; then
            echo "App already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "feat: stage WP3.7 end-of-day movement beat"
          git push origin HEAD:agent/r3-wp3-7-end-of-day-movement
