name: R3 WP3.9B2 build physical terrain asset

on:
  pull_request:
    paths:
      - 'scripts/maps/build-r3-physical-terrain-texture.py'
      - '.github/workflows/r3-wp3-9b2-build-physical-terrain-asset.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image build dependencies
        run: python -m pip install --disable-pip-version-check pillow==11.3.0 numpy==2.2.6

      - name: Download Natural Earth II source raster
        run: |
          curl --fail --location --retry 3 --retry-delay 3 \
            --output /tmp/NE2_50M_LC_SR_W.tif \
            https://raw.githubusercontent.com/nvkelso/natural-earth-raster/master/50m_rasters/NE2_50M_LC_SR_W/NE2_50M_LC_SR_W.tif
          test "$(stat -c%s /tmp/NE2_50M_LC_SR_W.tif)" -gt 150000000

      - name: Build Europe physical-colour texture
        run: |
          mkdir -p public/generated/r3-terrain
          python scripts/maps/build-r3-physical-terrain-texture.py \
            /tmp/NE2_50M_LC_SR_W.tif \
            public/generated/r3-terrain/europe-physical-colour-v1.webp \
            public/generated/r3-terrain/europe-physical-colour-v1.json
          test -s public/generated/r3-terrain/europe-physical-colour-v1.webp
          test "$(stat -c%s public/generated/r3-terrain/europe-physical-colour-v1.webp)" -lt 350000

      - name: Commit generated asset to the PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/generated/r3-terrain/europe-physical-colour-v1.webp public/generated/r3-terrain/europe-physical-colour-v1.json
          if git diff --cached --quiet; then
            echo 'Generated physical terrain asset is unchanged.'
          else
            git commit -m 'WP3.9B2: publish physical terrain colour asset'
            git push origin "HEAD:${HEAD_REF}"
          fi

      - name: Upload generated texture evidence
        uses: actions/upload-artifact@v4
        with:
          name: r3-wp3-9b2-physical-terrain-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            public/generated/r3-terrain/europe-physical-colour-v1.webp
            public/generated/r3-terrain/europe-physical-colour-v1.json
          if-no-files-found: error
          retention-days: 7
