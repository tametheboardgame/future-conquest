name: Build Phase VIII-B4C

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build:
    if: github.head_ref == 'agent/interdiction-combat-damage-viii-b4c' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/interdiction-combat-damage-viii-b4c
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply Phase VIII-B4C implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-viii-b4c.py')
          text = path.read_text()
          old = "engineering: 1.32\\n};\\n"
          if old not in text:
              raise SystemExit('Expected builder multiplier marker was not found')
          path.write_text(text.replace(old, "engineering: 1.08\\n};\\n", 1))
          PY
          python scripts/apply-viii-b4c.py

      - name: Install dependencies
        run: npm ci

      - name: Type-check test build
        shell: bash
        run: |
          set +e
          npx tsc -p tsconfig.test.json --pretty false > b4c-diagnostics.txt 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add b4c-diagnostics.txt
            git commit -m "Capture B4C compiler diagnostics"
            git push origin HEAD:agent/interdiction-combat-damage-viii-b4c
            exit "$code"
          fi
          rm b4c-diagnostics.txt

      - name: Run regression suite
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Commit implementation
        run: |
          rm scripts/apply-viii-b4c.py .github/workflows/build-viii-b4c.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add interdiction missions and combat infrastructure damage"
          git push origin HEAD:agent/interdiction-combat-damage-viii-b4c
