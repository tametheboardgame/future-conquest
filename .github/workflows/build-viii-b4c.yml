name: Build Phase VIII-B4C

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build:
    if: github.head_ref == 'agent/interdiction-combat-damage-viii-b4c' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/interdiction-combat-damage-viii-b4c
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply Phase VIII-B4C implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-viii-b4c.py')
          text = path.read_text()
          old = "engineering: 1.32\\n};\\n"
          if old not in text:
              raise SystemExit('Expected builder multiplier marker was not found')
          path.write_text(text.replace(old, "engineering: 1.08\\n};\\n", 1))
          PY
          python scripts/apply-viii-b4c.py
          python - <<'PY'
          from pathlib import Path
          for path in Path('tests').glob('*.test.cjs'):
              text = path.read_text()
              text = text.replace(r'saveVersion:\s*10', r'saveVersion:\s*11')
              path.write_text(text)
          persistence = Path('tests/persistence.test.cjs')
          text = persistence.read_text()
          text = text.replace('saveVersion: 10,', 'saveVersion: 11,', 1)
          text = text.replace("test('a current version 10 save is inspected with its matching metadata'", "test('a current version 11 save is inspected with its matching metadata'", 1)
          text = text.replace("assert.equal(result.source, 'v10');", "assert.equal(result.source, 'v11');", 1)
          persistence.write_text(text)
          focused = Path('tests/interdiction-viii-b4c.test.cjs')
          focused.write_text(focused.read_text().replace('../.test-dist/game/', '../.test-dist/'))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Type-check test build
        run: npx tsc -p tsconfig.test.json --pretty false

      - name: Run regression suite
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Commit implementation
        run: |
          rm scripts/apply-viii-b4c.py .github/workflows/build-viii-b4c.yml
          rm -f b4c-test-summary.txt b4c-test-output.txt b4c-diagnostics.txt b4c-failures.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add interdiction missions and combat infrastructure damage"
          git push origin HEAD:agent/interdiction-combat-damage-viii-b4c
