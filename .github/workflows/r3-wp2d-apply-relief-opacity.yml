name: Apply R3 WP2D relief opacity

on:
  push:
    branches:
      - agent/r3-wp2d-terrain-refinement
    paths:
      - 'scripts/apply-r3-wp2d-relief-opacity.mjs'
      - '.github/workflows/r3-wp2d-apply-relief-opacity.yml'

permissions:
  contents: write

jobs:
  apply-relief-opacity:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r3-wp2d-terrain-refinement
          fetch-depth: 0
      - name: Apply relief opacity
        run: node scripts/apply-r3-wp2d-relief-opacity.mjs
      - name: Commit relief opacity
        run: |
          git add src/components/TerrainMapPrototypeImpl.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove sea tile relief colour blocks'
          git push origin HEAD:agent/r3-wp2d-terrain-refinement
