name: Apply strategic balance pass

on:
  push:
    branches:
      - agent/current-engine-balance-tuning
    paths:
      - '.github/workflows/apply-strategic-balance-pass.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/current-engine-balance-tuning
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: node scripts/apply-strategic-balance-pass.mjs
      - run: npm test
      - name: Commit finished balance source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-strategic-balance-pass.yml
          git add src/game/strategic-response.ts src/game/strategic-balance.ts scripts/apply-strategic-balance-pass.mjs
          git commit -m "Tune escalation and mobilisation persistence"
          git push origin HEAD:agent/current-engine-balance-tuning
