name: Apply R3 WP2D marker declutter

on:
  push:
    branches:
      - agent/r3-wp2d-terrain-refinement
    paths:
      - 'scripts/apply-r3-wp2d-marker-declutter-wiring.mjs'
      - '.github/workflows/r3-wp2d-apply-marker-declutter.yml'

permissions:
  contents: write

jobs:
  apply-marker-declutter:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r3-wp2d-terrain-refinement
          fetch-depth: 0
      - name: Apply marker declutter wiring
        run: node scripts/apply-r3-wp2d-marker-declutter-wiring.mjs
      - name: Commit marker declutter wiring
        run: |
          git add src/components/TerrainMapPrototypeImpl.tsx
          if git diff --cached --quiet; then
            echo 'Marker declutter wiring already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Wire deterministic terrain marker declutter'
          git push origin HEAD:agent/r3-wp2d-terrain-refinement
