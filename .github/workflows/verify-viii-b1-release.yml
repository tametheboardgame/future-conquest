name: Verify Phase VIII-B1 live release

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'agent/verify-viii-b1-release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout released main commit
        uses: actions/checkout@v4
        with:
          ref: a8733aaf2e680ad22e24f2ce0a954a1fbf9654fe

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run released regression suite
        run: npm test

      - name: Build released production bundle
        run: npm run build

      - name: Verify released source markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q "PHASE VIII-B1 / STRATEGIC NETWORK" src/App.tsx
          grep -q "future-conquest-slice-v0.6" src/game/persistence.ts
          grep -q "STRATEGIC_ROUTES" src/game/strategic-network-data.ts
          grep -q "Strategic routes" src/components/MapView.tsx
          grep -q "strategic network overlays cannot intercept" tests/strategic-network-viii-b1.test.cjs
          test ! -e .github/workflows/apply-viii-b1-strategic-network-fixed.yml
          test ! -e scripts/apply-viii-b1.cjs.gz.b64

      - name: Verify GitHub Pages bundle
        shell: bash
        run: |
          set -euo pipefail
          site='https://tametheboardgame.github.io/future-conquest/'
          success=0

          for attempt in $(seq 1 30); do
            html=$(curl --fail --silent --show-error --location \
              -H 'Cache-Control: no-cache' \
              "${site}?verify_viii_b1=${GITHUB_RUN_ID}_${attempt}") || true

            js_path=$(printf '%s' "$html" | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -n 1 || true)
            css_path=$(printf '%s' "$html" | grep -oE 'assets/index-[A-Za-z0-9_-]+\.css' | head -n 1 || true)

            if [[ -n "$js_path" && -n "$css_path" ]]; then
              js=$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${site}${js_path}?verify=${GITHUB_RUN_ID}_${attempt}") || true
              css=$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${site}${css_path}?verify=${GITHUB_RUN_ID}_${attempt}") || true

              if printf '%s' "$js" | grep -q 'STRATEGIC INFRASTRUCTURE' \
                && printf '%s' "$js" | grep -q 'future-conquest-slice-v0.6' \
                && printf '%s' "$js" | grep -q 'Strategic routes' \
                && printf '%s' "$css" | grep -q 'strategic-route' \
                && printf '%s' "$css" | grep -q 'network-route-list'; then
                echo "Verified live Phase VIII-B1 bundles: $js_path and $css_path"
                success=1
                break
              fi
            fi

            echo "Live bundle not updated yet; attempt ${attempt}/30"
            sleep 10
          done

          if [[ "$success" -ne 1 ]]; then
            echo 'Phase VIII-B1 markers were not found in the live GitHub Pages bundles.' >&2
            exit 1
          fi
