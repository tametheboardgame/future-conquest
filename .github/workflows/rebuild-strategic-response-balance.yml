name: Rebuild strategic response balance

on:
  push:
    branches:
      - agent/current-engine-balance-tuning
    paths:
      - '.github/workflows/rebuild-strategic-response-balance.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/current-engine-balance-tuning
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: git fetch origin main
      - name: Restore known-good strategic response baseline
        run: git checkout origin/main -- src/game/strategic-response.ts tests/strategic-response-viii-a.test.cjs
      - run: node scripts/rebuild-strategic-response-balance.mjs
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit repaired balance implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rebuild-strategic-response-balance.yml
          git add src/game/strategic-response.ts tests/strategic-response-viii-a.test.cjs scripts/rebuild-strategic-response-balance.mjs
          git commit -m "Repair strategic response balance integration"
          git push origin HEAD:agent/current-engine-balance-tuning
