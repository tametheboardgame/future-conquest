name: R3 WP2F visual runtime probe

on:
  pull_request:
    paths:
      - 'src/components/TerrainMapPrototypeImpl.tsx'
      - 'src/presentation/r3-terrain-*'
      - 'src/presentation/r3-world-miniatures-layer.ts'
      - 'src/presentation/r3-landmark-miniature-assets.ts'
      - 'src/r3-terrain-prototype.css'
      - 'scripts/run-r3-wp2f-visual-runtime.mjs'
      - '.github/workflows/r3-wp2f-visual-runtime-probe.yml'
  workflow_dispatch:

jobs:
  chromium-wp2f:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --ignore-scripts playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run preview -- --host 127.0.0.1 > /tmp/r3-wp2f-preview.log 2>&1 &
      - run: node scripts/run-r3-wp2f-visual-runtime.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r3-wp2f-visual-runtime
          path: artifacts/r3-wp2f
