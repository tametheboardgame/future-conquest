name: Apply R3 WP2D Europe land mask

on:
  push:
    branches:
      - agent/r3-wp2d-terrain-refinement
    paths:
      - 'scripts/apply-r3-wp2d-europe-land-mask.mjs'
      - '.github/workflows/r3-wp2d-apply-europe-land-mask.yml'

permissions:
  contents: write

jobs:
  apply-europe-land-mask:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r3-wp2d-terrain-refinement
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Europe land mask
        run: npm run build:r3-europe-land-mask
      - name: Wire Europe land mask into renderer
        run: node scripts/apply-r3-wp2d-europe-land-mask.mjs
      - name: Commit Europe land mask
        run: |
          git add src/assets/r3-europe-land-mask.json src/components/TerrainMapPrototypeImpl.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use pre-clipped Europe land geometry'
          git push origin HEAD:agent/r3-wp2d-terrain-refinement
