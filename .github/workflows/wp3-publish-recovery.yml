name: Publish recovered WP3 implementation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/wp3-publish-recovery.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r2-wp3-territory-resources
          fetch-depth: 0
      - name: Apply verified WP3 patch and publish
        shell: bash
        run: |
          cat > /tmp/wp3.b64 <<'EOF'
          
          EOF
          base64 -d /tmp/wp3.b64 > /tmp/WP3.patch.gz
          echo 'f8721c8f2ac8faa245543f2dabdde596f966f74aa887b0932ae39823e00bf4c3  /tmp/WP3.patch.gz' | sha256sum -c -
          gzip -dc /tmp/WP3.patch.gz > /tmp/WP3.patch
          test "$(wc -c < /tmp/WP3.patch)" = "22759"
          echo '62bc906e0e8796e1b64693b77f39b312cce6e0023583a59a765605fc82e9b81f  /tmp/WP3.patch' | sha256sum -c -
          git apply --check /tmp/WP3.patch
          git apply /tmp/WP3.patch
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.tsx src/game/engine.ts src/game/strategic-response.ts src/game/supply-network.ts src/game/territory-resources.ts src/game/types.ts tests/r2-wp3-territory-logistics.test.cjs
          git commit -m 'feat: implement R2-WP3 territory logistics [wp3-recovered]'
          git push origin HEAD:agent/r2-wp3-territory-resources
