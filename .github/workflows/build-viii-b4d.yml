name: Build Phase VIII-B4D

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build:
    if: github.head_ref == 'agent/logistics-priorities-viii-b4d' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/logistics-priorities-viii-b4d
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply Phase VIII-B4D implementation
        run: |
          python scripts/apply-viii-b4d.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/command-interface-vii-a.test.cjs')
          text = path.read_text()
          old = "  assert.match(app, /Supply priority command/);"
          new = "  assert.match(read('src/components/LogisticsCommand.tsx'), /Supply priority command/);"
          if old not in text:
              raise SystemExit('Expected logistics heading assertion was not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Type-check test build
        run: npx tsc -p tsconfig.test.json --pretty false

      - name: Run regression suite
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Commit implementation
        run: |
          rm scripts/apply-viii-b4d.py .github/workflows/build-viii-b4d.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add manual logistics priorities"
          git push origin HEAD:agent/logistics-priorities-viii-b4d
