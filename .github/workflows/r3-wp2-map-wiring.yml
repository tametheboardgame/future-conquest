name: R3 WP2 renderer wiring

on:
  push:
    branches:
      - agent/r3-wp2-2_5d-strategic-map
    paths:
      - scripts/apply-r3-wp2-map-wiring.mjs

permissions:
  contents: write

jobs:
  wire-map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/r3-wp2-2_5d-strategic-map
          fetch-depth: 0
      - name: Apply guarded renderer patch
        run: node scripts/apply-r3-wp2-map-wiring.mjs
      - name: Commit renderer wiring
        run: |
          if git diff --quiet -- src/components/MapView.tsx; then
            echo "No renderer changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/MapView.tsx
          git commit -m "Wire WP2 terrain and front-line rendering"
          git push origin HEAD:agent/r3-wp2-2_5d-strategic-map
