name: R3 WP2B wire prototype

on:
  push:
    branches:
      - agent/r3-wp2b-real-terrain
    paths:
      - .github/workflows/r3-wp2b-wire.yml

permissions:
  contents: write

jobs:
  wire-prototype:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WP2B branch
        uses: actions/checkout@v4
        with:
          ref: agent/r3-wp2b-real-terrain
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Wire hidden terrain prototype
        run: node scripts/r3-wp2b-wire-prototype.mjs
      - name: Commit App wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          if git diff --cached --quiet; then
            echo "Prototype already wired"
          else
            git commit -m "Wire hidden real terrain prototype"
            git push origin HEAD:agent/r3-wp2b-real-terrain
          fi
# one-shot wiring trigger
