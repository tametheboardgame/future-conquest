name: R3 WP2D wire runtime errors

on:
  push:
    branches:
      - agent/r3-wp2d-terrain-refinement
    paths:
      - 'scripts/apply-r3-wp2d-runtime-error-wiring.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/r3-wp2d-terrain-refinement
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply deterministic runtime-error wiring
        run: node scripts/apply-r3-wp2d-runtime-error-wiring.mjs
      - name: Commit patched game file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/TerrainMapPrototypeImpl.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Wire WP2D transient terrain error handling"
          git push origin HEAD:agent/r3-wp2d-terrain-refinement
