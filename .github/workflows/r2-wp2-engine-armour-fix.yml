name: R2-WP2 operational armour fix

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/r2-wp2-engineering-infrastructure
          fetch-depth: 0
      - name: Apply helper fix
        run: python3 scripts/r2-wp2-engine-armour-fix.py
      - name: Commit helper fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/engine.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "R2-WP2: separate operator armour from engineering combat availability"
          git push origin HEAD:agent/r2-wp2-engineering-infrastructure
