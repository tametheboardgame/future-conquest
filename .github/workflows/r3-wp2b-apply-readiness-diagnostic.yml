name: R3 WP2B apply readiness diagnostic
on:
  push:
    branches:
      - agent/r3-wp2b-browser-runtime-fix
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r3-wp2b-browser-runtime-fix
      - run: python scripts/apply-r3-wp2b-readiness-diagnostic.py
      - run: npm ci && npm run build
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/TerrainMapPrototypeImpl.tsx
          git commit -m 'Trace MapLibre terrain readiness state'
          git push origin HEAD:agent/r3-wp2b-browser-runtime-fix
