name: Apply desktop command fit

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/desktop-command-fit'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout desktop command fit branch
        uses: actions/checkout@v4
        with:
          ref: agent/desktop-command-fit
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply desktop command fit
        run: python3 scripts/apply-desktop-command-fit.py

      - name: Install dependencies
        run: npm ci

      - name: Run regression suite
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Commit validated interface correction
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply-desktop-command-fit.py .github/workflows/apply-desktop-command-fit.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: fit desktop command shell and surface order actions"
          git push origin HEAD:agent/desktop-command-fit
