name: Apply R3 WP2D Theatre land LOD

on:
  push:
    branches:
      - agent/r3-wp2d-terrain-refinement
    paths:
      - 'scripts/apply-r3-wp2d-theatre-land-lod.mjs'
      - '.github/workflows/r3-wp2d-apply-theatre-land-lod.yml'

permissions:
  contents: write

jobs:
  apply-theatre-land-lod:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r3-wp2d-terrain-refinement
          fetch-depth: 0
      - name: Apply Theatre land LOD
        run: node scripts/apply-r3-wp2d-theatre-land-lod.mjs
      - name: Commit Theatre land LOD
        run: |
          git add src/components/TerrainMapPrototypeImpl.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use clean chart land treatment at Theatre scale'
          git push origin HEAD:agent/r3-wp2d-terrain-refinement
