name: R3 WP3 formation movement gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/App.tsx'
      - 'src/presentation/r3-formation-*.ts'
      - 'src/presentation/r3-terrain-operational-markers*.ts'
      - 'src/map-label-hierarchy.css'
      - 'src/r3-formation-route-overlay.css'
      - 'tests/r3-wp3-*.test.cjs'
      - '.github/workflows/r3-wp3-formation-movement.yml'

permissions:
  contents: read

jobs:
  wp3-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run focused WP3 tests
        id: focused
        shell: bash
        run: |
          set +e
          node --test tests/r3-wp3-formation-movement.test.cjs tests/r3-wp3-7-end-day-movement.test.cjs 2>&1 | tee wp3-focused.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Run full regression suite
        id: full
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee wp3-full-test.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Build production game
        id: build
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee wp3-build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload WP3 diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-wp3-regression-${{ github.event.pull_request.head.sha }}
          path: |
            wp3-focused.log
            wp3-full-test.log
            wp3-build.log
          if-no-files-found: error
      - name: Enforce WP3 gate
        shell: bash
        run: |
          if [ "${{ steps.focused.outputs.status }}" != "0" ]; then
            echo "Focused WP3 tests failed" >&2
            exit 1
          fi
          if [ "${{ steps.full.outputs.status }}" != "0" ]; then
            echo "Full regression suite failed" >&2
            exit 1
          fi
          if [ "${{ steps.build.outputs.status }}" != "0" ]; then
            echo "Production build failed" >&2
            exit 1
          fi
