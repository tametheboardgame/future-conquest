name: Apply Phase VIII-B3 supply throughput

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/supply-throughput-viii-b3'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase VIII-B3 branch
        uses: actions/checkout@v4
        with:
          ref: agent/supply-throughput-viii-b3
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Align Phase VIII-B3 compatibility coverage
        run: python3 scripts/refine-supply-throughput-viii-b3.py

      - name: Correct escaped Phase VIII-B3 assertions
        run: python3 scripts/finalise-supply-throughput-viii-b3.py

      - name: Apply Phase VIII-B3 integration
        run: python3 scripts/apply-supply-throughput-viii-b3.py

      - name: Install dependencies
        run: npm ci

      - name: Run regression suite
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Commit validated Phase VIII-B3 implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/finalise-supply-throughput-viii-b3.py scripts/refine-supply-throughput-viii-b3.py scripts/apply-supply-throughput-viii-b3.py .github/workflows/apply-supply-throughput-viii-b3.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: add finite supply throughput and logistics"
          git push origin HEAD:agent/supply-throughput-viii-b3
