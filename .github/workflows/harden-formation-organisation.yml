name: Harden formation organisation core

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  harden:
    if: github.head_ref == 'agent/formation-organisation-core'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply hardening changes
        run: node scripts/harden-formation-organisation.mjs
      - name: Install dependencies
        run: npm ci
      - name: Run complete regression suite
        run: npm test
      - name: Build production game
        run: npm run build
      - name: Remove temporary hardening files
        run: |
          rm scripts/harden-formation-organisation.mjs
          rm .github/workflows/harden-formation-organisation.yml
      - name: Commit hardened implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs
          git add -u scripts/harden-formation-organisation.mjs .github/workflows/harden-formation-organisation.yml
          git commit -m "Harden formation organisation core"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
