name: Apply desktop trackpad and country labels

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/desktop-trackpad-country-labels'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/desktop-trackpad-country-labels
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply map input and label hierarchy changes
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const replaceOnce = (source, before, after, label) => {
            if (!source.includes(before)) throw new Error(`Could not locate ${label}`);
            return source.replace(before, after);
          };

          const mapPath = 'src/components/MapView.tsx';
          let map = fs.readFileSync(mapPath, 'utf8');
          map = replaceOnce(
            map,
            "  PointerEvent as ReactPointerEvent,\n  WheelEvent as ReactWheelEvent\n",
            "  PointerEvent as ReactPointerEvent\n",
            'React wheel-event import'
          );
          map = replaceOnce(
            map,
            "  const viewRef = useRef(view);\n",
            "  const viewRef = useRef(view);\n  const svgRef = useRef<SVGSVGElement | null>(null);\n",
            'SVG viewport ref'
          );
          map = replaceOnce(
            map,
            "  useEffect(() => {\n    const refreshOverlayBoost = () => setOverlayBoost(responsiveOverlayBoost());\n    window.addEventListener('resize', refreshOverlayBoost);\n    return () => window.removeEventListener('resize', refreshOverlayBoost);\n  }, []);\n",
            "  useEffect(() => {\n    const refreshOverlayBoost = () => setOverlayBoost(responsiveOverlayBoost());\n    window.addEventListener('resize', refreshOverlayBoost);\n    return () => window.removeEventListener('resize', refreshOverlayBoost);\n  }, []);\n\n  useEffect(() => {\n    const mapElement = svgRef.current;\n    if (!mapElement) return;\n\n    const handleNativeWheel = (event: WheelEvent) => {\n      event.preventDefault();\n      const anchor = screenPointToMap(\n        event.clientX,\n        event.clientY,\n        mapElement.getBoundingClientRect(),\n        viewRef.current\n      );\n      const sensitivity = event.ctrlKey ? 0.008 : 0.0015;\n      const factor = Math.exp(-event.deltaY * sensitivity);\n      setView(current => zoomMapView(current, factor, anchor));\n    };\n\n    mapElement.addEventListener('wheel', handleNativeWheel, { passive: false });\n    return () => mapElement.removeEventListener('wheel', handleNativeWheel);\n  }, []);\n",
            'native non-passive wheel listener'
          );
          map = replaceOnce(
            map,
            "  const handleWheel = (event: ReactWheelEvent<SVGSVGElement>) => {\n    event.preventDefault();\n    const anchor = screenPointToMap(event.clientX, event.clientY, event.currentTarget.getBoundingClientRect(), viewRef.current);\n    const factor = Math.exp(-event.deltaY * 0.0015);\n    setView(current => zoomMapView(current, factor, anchor));\n  };\n\n",
            '',
            'legacy React wheel handler'
          );
          map = replaceOnce(
            map,
            "    <svg\n      className={`map europe-map ${panning ? 'panning' : ''}`}\n",
            "    <svg\n      ref={svgRef}\n      className={`map europe-map ${panning ? 'panning' : ''}`}\n",
            'SVG ref binding'
          );
          map = replaceOnce(map, "      onWheel={handleWheel}\n", '', 'legacy JSX wheel binding');
          fs.writeFileSync(mapPath, map);

          const europePath = 'src/europe-map.css';
          let europe = fs.readFileSync(europePath, 'utf8');
          europe = replaceOnce(
            europe,
            ".future-theatre-labels text {\n  fill: #55727e;\n  stroke: #07131c;\n  stroke-width: 3;\n  paint-order: stroke;\n  text-anchor: middle;\n  font: 600 11px IBM Plex Mono, monospace;\n  letter-spacing: .08em;\n}\n",
            ".future-theatre-labels .country-name-label {\n  fill: #70d7d0;\n  stroke: #061018;\n  stroke-width: 4.5;\n  paint-order: stroke;\n  text-anchor: middle;\n  font: 700 18px Barlow Condensed, sans-serif;\n  letter-spacing: .14em;\n  text-transform: uppercase;\n  opacity: .9;\n}\n\n.future-theatre-labels .country-name-label.compact {\n  font-size: 14px;\n  letter-spacing: .08em;\n}\n",
            'country label styling'
          );
          fs.writeFileSync(europePath, europe);

          const mobilePath = 'src/mobile-map-corrections.css';
          let mobile = fs.readFileSync(mobilePath, 'utf8');
          mobile = replaceOnce(
            mobile,
            "  .europe-map .future-theatre-labels .country-name-label {\n    font-size: 12px;\n    stroke-width: 4px;\n  }\n\n  .europe-map .future-theatre-labels .country-name-label.compact {\n    font-size: 10px;\n  }\n",
            "  .europe-map .future-theatre-labels .country-name-label {\n    font-size: 19px;\n    stroke-width: 5px;\n  }\n\n  .europe-map .future-theatre-labels .country-name-label.compact {\n    font-size: 16px;\n  }\n",
            'mobile country label sizing'
          );
          fs.writeFileSync(mobilePath, mobile);

          fs.writeFileSync('tests/desktop-trackpad-country-labels.test.cjs', `const test = require('node:test');
const assert = require('node:assert/strict');
const fs = require('node:fs');
const path = require('node:path');

const read = file => fs.readFileSync(path.join(process.cwd(), file), 'utf8');

test('desktop trackpad pinch is captured by a non-passive native map listener', () => {
  const source = read('src/components/MapView.tsx');
  assert.match(source, /const svgRef = useRef<SVGSVGElement \\| null>\\(null\\)/);
  assert.match(source, /addEventListener\\('wheel', handleNativeWheel, \\{ passive: false \\}\\)/);
  assert.match(source, /event\\.preventDefault\\(\\)/);
  assert.match(source, /event\\.ctrlKey \\? 0\\.008 : 0\\.0015/);
  assert.doesNotMatch(source, /onWheel=\\{handleWheel\\}/);
});

test('country names use a larger strategic style distinct from territory centres', () => {
  const europe = read('src/europe-map.css');
  const mobile = read('src/mobile-map-corrections.css');
  assert.match(europe, /country-name-label[\\s\\S]*fill:\\s*#70d7d0/);
  assert.match(europe, /country-name-label[\\s\\S]*font:\\s*700 18px Barlow Condensed/);
  assert.match(europe, /country-name-label[\\s\\S]*text-transform:\\s*uppercase/);
  assert.match(europe, /territory-centre-label[\\s\\S]*font-size:\\s*12px/);
  assert.match(mobile, /country-name-label[\\s\\S]*font-size:\\s*19px/);
  assert.match(mobile, /country-name-label\\.compact[\\s\\S]*font-size:\\s*16px/);
});
`);

          fs.rmSync('.github/workflows/apply-desktop-trackpad-country-labels.yml');
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Run regression suite
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Commit finished refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix desktop trackpad zoom and strengthen country labels"
          git push origin HEAD:agent/desktop-trackpad-country-labels
