name: Apply counterattack warning window

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/escalation-mobilisation-viii-a'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/escalation-mobilisation-viii-a
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply warning-window refinement
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const replaceOnce = (source, before, after, label) => {
            if (!source.includes(before)) throw new Error(`Could not locate ${label}`);
            return source.replace(before, after);
          };

          let types = fs.readFileSync('src/game/types.ts', 'utf8');
          types = replaceOnce(
            types,
            "  origin?: string;\n  target: string;\n  status: 'planned' | 'executing' | 'completed';",
            "  origin?: string;\n  target: string;\n  executeTurn?: number;\n  status: 'planned' | 'executing' | 'completed';",
            'enemy-order execution turn'
          );
          fs.writeFileSync('src/game/types.ts', types);

          let strategic = fs.readFileSync('src/game/strategic-response.ts', 'utf8');
          strategic = replaceOnce(
            strategic,
            "      ? `Enemy communications indicate preparations against ${TERRITORIES[order.target].centre}.`",
            "      ? `Enemy communications indicate preparations against ${TERRITORIES[order.target].centre}. The operation is assessed for day ${order.executeTurn ?? state.turn}.`",
            'counterattack intelligence warning'
          );
          strategic = replaceOnce(
            strategic,
            "  const retainedOrders = state.enemyOrders\n    .filter(order => order.status === 'completed' && state.turn - order.turn <= 3)\n    .slice(0, 8);",
            "  const retainedOrders = state.enemyOrders\n    .filter(order => order.status !== 'completed' || state.turn - order.turn <= 3)\n    .slice(0, 12);",
            'retained enemy orders'
          );
          strategic = replaceOnce(
            strategic,
            "  const orderLimit = next.escalationStage === 1 ? 1 : next.escalationStage <= 3 ? 2 : 3;",
            "  const orderLimit = next.escalationStage === 1 ? 1 : next.escalationStage <= 3 ? 2 : 3;\n  const availableOrderSlots = Math.max(0, orderLimit - retainedOrders.filter(order => order.status !== 'completed').length);",
            'active order slot accounting'
          );
          strategic = strategic.replaceAll('planned.length < orderLimit', 'planned.length < availableOrderSlots');
          strategic = replaceOnce(
            strategic,
            "\n  if (next.escalationStage >= 2 && playerFront.length && planned.length < availableOrderSlots) {",
            "\n  const pendingCounterattack = retainedOrders.some(order => order.type === 'counterattack' && order.status !== 'completed');\n  if (next.escalationStage >= 2 && playerFront.length && !pendingCounterattack && planned.length < availableOrderSlots) {",
            'pending counterattack guard'
          );
          strategic = replaceOnce(
            strategic,
            "        target,\n        status: 'planned',\n        priority: 100,\n        summary: `Counterattack assessed against ${TERRITORIES[target].centre}`",
            "        target,\n        executeTurn: next.turn + 1,\n        status: 'planned',\n        priority: 100,\n        summary: `Counterattack preparations detected against ${TERRITORIES[target].centre}`",
            'delayed counterattack order'
          );
          strategic = replaceOnce(
            strategic,
            "          status: 'executing',\n          priority: 70,",
            "          status: 'completed',\n          priority: 70,",
            'completed reposition order'
          );
          strategic = replaceOnce(
            strategic,
            "export function getPlannedCounterattack(state: GameState): EnemyOrder | undefined {\n  return state.enemyOrders.find(order => (\n    order.type === 'counterattack'\n    && (order.status === 'planned' || order.status === 'executing')\n  ));\n}",
            "export function getPlannedCounterattack(state: GameState): EnemyOrder | undefined {\n  return [...state.enemyOrders]\n    .sort((first, second) => (first.executeTurn ?? first.turn) - (second.executeTurn ?? second.turn))\n    .find(order => (\n      order.type === 'counterattack'\n      && (order.status === 'planned' || order.status === 'executing')\n      && (order.executeTurn ?? order.turn) <= state.turn\n    ));\n}",
            'due counterattack selector'
          );
          fs.writeFileSync('src/game/strategic-response.ts', strategic);

          let engine = fs.readFileSync('src/game/engine.ts', 'utf8');
          const reinforcementPattern = /\nfunction reinforceEnemy\(state: GameState\): GameState \{[\s\S]*?\n\}\n\nfunction pruneOperations/;
          if (!reinforcementPattern.test(engine)) throw new Error('Could not locate obsolete reinforcement function');
          engine = engine.replace(reinforcementPattern, '\nfunction pruneOperations');
          engine = replaceOnce(
            engine,
            "  if (!frontier.length) return state;\n  frontier.sort((a, b) => {",
            "  if (!frontier.length) return plannedCounterattack ? completeEnemyOrder(state, plannedCounterattack.id) : state;\n  frontier.sort((a, b) => {",
            'empty frontier planned-order completion'
          );
          engine = replaceOnce(
            engine,
            "  });\n  const target = plannedCounterattack && frontier.some(id => id === plannedCounterattack.target)",
            "  });\n  if (plannedCounterattack && !frontier.some(id => id === plannedCounterattack.target)) {\n    return completeEnemyOrder(state, plannedCounterattack.id);\n  }\n  const target = plannedCounterattack && frontier.some(id => id === plannedCounterattack.target)",
            'invalid planned target completion'
          );
          engine = replaceOnce(
            engine,
            "  if (!formations.length) return state;",
            "  if (!formations.length) return plannedCounterattack ? completeEnemyOrder(state, plannedCounterattack.id) : state;",
            'unavailable planned formation completion'
          );
          fs.writeFileSync('src/game/engine.ts', engine);

          let app = fs.readFileSync('src/App.tsx', 'utf8');
          app = replaceOnce(
            app,
            "    <p>{order.origin ? `${TERRITORIES[order.origin].centre} → ` : ''}{TERRITORIES[order.target].centre} · {order.status}</p>",
            "    <p>{order.origin ? `${TERRITORIES[order.origin].centre} → ` : ''}{TERRITORIES[order.target].centre}{order.executeTurn ? ` · expected day ${String(order.executeTurn).padStart(3, '0')}` : ''} · {order.status}</p>",
            'enemy plan expected day'
          );
          fs.writeFileSync('src/App.tsx', app);

          let tests = fs.readFileSync('tests/strategic-response-viii-a.test.cjs', 'utf8');
          tests = replaceOnce(
            tests,
            "  getEscalationStage,\n  resolveStrategicResponse,",
            "  getEscalationStage,\n  getPlannedCounterattack,\n  resolveStrategicResponse,",
            'planned-counterattack test import'
          );
          tests = replaceOnce(
            tests,
            "  assert.ok(next.enemyOrders.length >= 1);\n  assert.ok(next.intelligenceReports.some(report => report.kind === 'order'));\n});",
            "  assert.ok(next.enemyOrders.length >= 1);\n  assert.ok(next.intelligenceReports.some(report => report.kind === 'order'));\n  const counterattack = next.enemyOrders.find(order => order.type === 'counterattack');\n  assert.ok(counterattack);\n  assert.equal(counterattack.executeTurn, next.turn + 1);\n  assert.equal(getPlannedCounterattack(next), undefined);\n  assert.equal(getPlannedCounterattack({ ...next, turn: counterattack.executeTurn }).id, counterattack.id);\n});\n\ntest('counterattack intelligence provides a full-day warning before combat resolves', () => {\n  let state = newGame(73, 'hard');\n  state.escalation = 55;\n  state = endTurn(state);\n  const plan = state.enemyOrders.find(order => order.type === 'counterattack' && order.status === 'planned');\n  assert.ok(plan);\n  assert.equal(plan.executeTurn, state.turn + 1);\n  const next = endTurn(state);\n  const completed = next.enemyOrders.find(order => order.id === plan.id);\n  assert.ok(completed);\n  assert.equal(completed.status, 'completed');\n});",
            'counterattack warning tests'
          );
          tests = replaceOnce(
            tests,
            "  assert.match(app, /GLOBAL ESCALATION · STAGE/);",
            "  assert.match(app, /GLOBAL ESCALATION · STAGE/);\n  assert.match(app, /expected day/);",
            'enemy-plan UI test'
          );
          fs.writeFileSync('tests/strategic-response-viii-a.test.cjs', tests);

          fs.rmSync('.github/workflows/apply-counterattack-warning.yml');
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Run regression suite
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Commit warning-window refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Give counterattack intelligence a warning window"
          git push origin HEAD:agent/escalation-mobilisation-viii-a
