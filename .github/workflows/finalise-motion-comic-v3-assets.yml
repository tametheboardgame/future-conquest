name: Finalise Motion Comic V3 asset pipeline

on:
  push:
    branches:
      - agent/workstream2-cleanup
    paths:
      - .github/workflows/finalise-motion-comic-v3-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalise-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/workstream2-cleanup
          fetch-depth: 0

      - name: Replace asset validation build step
        run: |
          cat > scripts/build-motion-comic-assets.mjs <<'EOF'
          import { mkdir, readFile, stat, writeFile } from 'node:fs/promises';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';

          const repositoryRoot = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '..');
          const buildInfoDirectory = path.join(repositoryRoot, 'src', 'generated');
          const buildInfoFile = path.join(buildInfoDirectory, 'build-info.ts');

          const ASSETS = [
            'generated/motion-comic-v3/page1/panel-01-world-that-remains.webp',
            'generated/motion-comic-v3/page1/panel-02-human-cost.webp',
            'generated/motion-comic-v3/page1/panel-03-final-command.webp',
            'generated/motion-comic-v3/page1/panel-04-anomaly.webp',
            'generated/motion-comic-v3/page1/panel-05-hypothesis.webp',
            'generated/motion-comic-v3/page1/panel-06-order.webp',
            'generated/motion-comic-v3/page2/panel-07-portal.webp',
            'generated/motion-comic-v3/page2/panel-08-crossing.webp',
            'generated/motion-comic-v3/page2/panel-09-arrival-default.webp',
            'generated/motion-comic-v3/page2/panel-10-first-contact.webp',
            'generated/motion-comic-v3/page2/panel-11-world-responds.webp',
            'generated/motion-comic-v3/page2/panel-12-burden-of-command.webp',
            'generated/motion-comic-v3/title/title-card-future-conquest.webp'
          ];

          function isWebP(bytes) {
            return bytes.subarray(0, 4).toString('ascii') === 'RIFF'
              && bytes.subarray(8, 12).toString('ascii') === 'WEBP';
          }

          for (const relativePath of ASSETS) {
            const assetPath = path.join(repositoryRoot, 'public', relativePath);
            const fileStats = await stat(assetPath);
            const bytes = await readFile(assetPath);
            if (!isWebP(bytes) || fileStats.size < 50_000) {
              throw new Error(`Motion Comic production asset is invalid: ${relativePath}`);
            }
            console.log(`Validated public/${relativePath} (${fileStats.size} bytes).`);
          }

          const buildNumber = process.env.GITHUB_RUN_NUMBER ?? 'local';
          const buildSha = (process.env.GITHUB_SHA ?? 'development').slice(0, 7);
          const buildTime = new Date().toISOString();
          const buildInfoSource = [
            `export const BUILD_NUMBER = ${JSON.stringify(buildNumber)};`,
            `export const BUILD_SHA = ${JSON.stringify(buildSha)};`,
            `export const BUILD_TIME = ${JSON.stringify(buildTime)};`,
            'export const BUILD_LABEL = `Prologue build ${BUILD_NUMBER} · ${BUILD_SHA}`;',
            ''
          ].join('\n');

          await mkdir(buildInfoDirectory, { recursive: true });
          await writeFile(buildInfoFile, buildInfoSource, 'utf8');
          console.log(`Validated ${ASSETS.length} Motion Comic V3 assets and stamped build ${buildNumber} at ${buildSha}.`);
          EOF

      - name: Replace production artifact verification
        run: |
          cat > scripts/verify-motion-comic-build.mjs <<'EOF'
          import { readFile, stat } from 'node:fs/promises';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';

          const repositoryRoot = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '..');
          const ASSETS = [
            'generated/motion-comic-v3/page1/panel-01-world-that-remains.webp',
            'generated/motion-comic-v3/page1/panel-02-human-cost.webp',
            'generated/motion-comic-v3/page1/panel-03-final-command.webp',
            'generated/motion-comic-v3/page1/panel-04-anomaly.webp',
            'generated/motion-comic-v3/page1/panel-05-hypothesis.webp',
            'generated/motion-comic-v3/page1/panel-06-order.webp',
            'generated/motion-comic-v3/page2/panel-07-portal.webp',
            'generated/motion-comic-v3/page2/panel-08-crossing.webp',
            'generated/motion-comic-v3/page2/panel-09-arrival-default.webp',
            'generated/motion-comic-v3/page2/panel-10-first-contact.webp',
            'generated/motion-comic-v3/page2/panel-11-world-responds.webp',
            'generated/motion-comic-v3/page2/panel-12-burden-of-command.webp',
            'generated/motion-comic-v3/title/title-card-future-conquest.webp'
          ];

          function isWebP(bytes) {
            return bytes.subarray(0, 4).toString('ascii') === 'RIFF'
              && bytes.subarray(8, 12).toString('ascii') === 'WEBP';
          }

          for (const relativePath of ASSETS) {
            const sourcePath = path.join(repositoryRoot, 'public', relativePath);
            const builtPath = path.join(repositoryRoot, 'dist', relativePath);
            const sourceStats = await stat(sourcePath);
            const builtStats = await stat(builtPath);
            const builtBytes = await readFile(builtPath);

            if (!isWebP(builtBytes) || builtStats.size !== sourceStats.size) {
              throw new Error(`Production bundle did not preserve Motion Comic asset: ${relativePath}`);
            }
            console.log(`Verified dist/${relativePath} (${builtStats.size} bytes).`);
          }
          EOF

      - name: Remove obsolete sprite source
        run: |
          set -euo pipefail
          test -z "$(grep -R "MOTION_COMIC_SPRITE\|motion-comic-v2/sprite" src --exclude-dir=motion-comic-v2 || true)"
          rm -rf src/assets/motion-comic-v2
          rm -f public/generated/motion-comic-v2-sprite.webp

      - name: Validate complete project
        run: |
          npm ci
          npm test
          npm run build

      - name: Remove one-time workflow and commit
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalise-motion-comic-v3-assets.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build-motion-comic-assets.mjs \
            scripts/verify-motion-comic-build.mjs \
            src/assets/motion-comic-v2 \
            .github/workflows
          git commit -m 'Remove obsolete Motion Comic sprite pipeline'
          git push origin HEAD:agent/workstream2-cleanup
