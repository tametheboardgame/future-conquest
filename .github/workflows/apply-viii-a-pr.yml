name: Execute Phase VIII-A integration

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/escalation-mobilisation-viii-a'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/escalation-mobilisation-viii-a
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extract and run integration script
        run: |
          python <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-viii-a-strategic-response.yml').read_text()
          marker = "          node <<'NODE'\n"
          block = source.split(marker, 1)[1].split('\n          NODE', 1)[0]
          block = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          Path('/tmp/apply-viii-a.js').write_text(block + '\n')
          PY
          node /tmp/apply-viii-a.js
          rm -f .github/workflows/apply-viii-a-pr.yml

      - name: Install dependencies
        run: npm ci

      - name: Run regression suite
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Commit Phase VIII-A
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement escalation mobilisation and enemy command"
          git push origin HEAD:agent/escalation-mobilisation-viii-a
