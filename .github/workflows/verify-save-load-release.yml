name: Verify save load release

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: write
  deployments: read
  pages: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify main build, deployment and live bundle
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const targetSha = '680d4dc5ee9bf6a1ab69f1ebb94ef7132aa6ee6b';
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            const failures = [];

            try {
              let mainRun;
              for (let attempt = 0; attempt < 36; attempt += 1) {
                const runs = await github.rest.actions.listWorkflowRunsForRepo({
                  owner,
                  repo,
                  head_sha: targetSha,
                  per_page: 50
                });
                mainRun = runs.data.workflow_runs.find(run =>
                  run.name === 'Build and deploy Future Conquest' &&
                  run.event === 'push' &&
                  run.head_branch === 'main'
                );
                if (mainRun?.status === 'completed') break;
                await sleep(5000);
              }

              if (!mainRun) {
                failures.push('No main-branch push workflow was found for the release commit.');
              } else {
                core.notice(`MAIN_RUN=${JSON.stringify({
                  id: mainRun.id,
                  status: mainRun.status,
                  conclusion: mainRun.conclusion,
                  head_branch: mainRun.head_branch,
                  head_sha: mainRun.head_sha,
                  html_url: mainRun.html_url
                })}`);
                if (mainRun.status !== 'completed' || mainRun.conclusion !== 'success') {
                  failures.push(`Main workflow did not complete successfully: ${mainRun.status}/${mainRun.conclusion}`);
                }

                const jobs = await github.rest.actions.listJobsForWorkflowRun({
                  owner,
                  repo,
                  run_id: mainRun.id,
                  filter: 'latest',
                  per_page: 100
                });
                core.notice(`MAIN_JOBS=${JSON.stringify(jobs.data.jobs.map(job => ({
                  name: job.name,
                  conclusion: job.conclusion,
                  steps: job.steps?.map(step => ({ name: step.name, conclusion: step.conclusion }))
                })))}`);
                const build = jobs.data.jobs.find(job => job.name === 'build');
                const deploy = jobs.data.jobs.find(job => job.name === 'deploy');
                if (build?.conclusion !== 'success') failures.push(`Main build job conclusion was ${build?.conclusion ?? 'missing'}.`);
                if (deploy?.conclusion !== 'success') failures.push(`Pages deploy job conclusion was ${deploy?.conclusion ?? 'missing'}.`);
              }

              const deployments = await github.rest.repos.listDeployments({
                owner,
                repo,
                sha: targetSha,
                environment: 'github-pages',
                per_page: 20
              });
              core.notice(`DEPLOYMENTS=${JSON.stringify(deployments.data.map(deployment => ({
                id: deployment.id,
                ref: deployment.ref,
                sha: deployment.sha,
                environment: deployment.environment
              })))}`);
              if (!deployments.data.length) {
                failures.push('No github-pages deployment record exists for the release commit.');
              } else {
                let successfulDeployment = false;
                for (const deployment of deployments.data) {
                  const statuses = await github.rest.repos.listDeploymentStatuses({
                    owner,
                    repo,
                    deployment_id: deployment.id,
                    per_page: 20
                  });
                  core.notice(`DEPLOYMENT_${deployment.id}_STATUSES=${JSON.stringify(statuses.data.map(status => ({
                    state: status.state,
                    environment_url: status.environment_url,
                    log_url: status.log_url
                  })))}`);
                  if (statuses.data.some(status => status.state === 'success')) successfulDeployment = true;
                }
                if (!successfulDeployment) failures.push('No successful github-pages deployment status exists for the release commit.');
              }

              const pages = await github.rest.repos.getPages({ owner, repo });
              const siteUrl = pages.data.html_url || 'https://tametheboardgame.github.io/future-conquest/';
              const indexResponse = await fetch(siteUrl, { cache: 'no-store' });
              if (!indexResponse.ok) {
                failures.push(`Live site returned HTTP ${indexResponse.status}.`);
              } else {
                const index = await indexResponse.text();
                const scriptMatch = index.match(/<script[^>]+src="([^"]+\.js)"/);
                if (!scriptMatch) {
                  failures.push('Could not find the production JavaScript bundle in the live index.');
                } else {
                  const bundleUrl = new URL(scriptMatch[1], siteUrl).toString();
                  const bundleResponse = await fetch(bundleUrl, { cache: 'no-store' });
                  if (!bundleResponse.ok) {
                    failures.push(`Live JavaScript bundle returned HTTP ${bundleResponse.status}.`);
                  } else {
                    const bundle = await bundleResponse.text();
                    const markers = {
                      gameSaved: bundle.includes('Game saved'),
                      gameLoaded: bundle.includes('Game loaded'),
                      autosaved: bundle.includes('Autosaved'),
                      metadataKey: bundle.includes('future-conquest-slice-v0.4-metadata')
                    };
                    core.notice(`LIVE_CONTENT=${JSON.stringify({ siteUrl, bundleUrl, ...markers })}`);
                    if (Object.values(markers).some(value => !value)) {
                      failures.push(`The live bundle is missing release markers: ${JSON.stringify(markers)}`);
                    }
                  }
                }
              }
            } catch (error) {
              failures.push(`${error.status ?? 'error'}: ${error.message}`);
            } finally {
              try {
                await github.rest.pulls.update({
                  owner,
                  repo,
                  pull_number: context.payload.pull_request.number,
                  state: 'closed'
                });
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: 'heads/agent/verify-save-load-release'
                });
              } catch (cleanupError) {
                core.warning(`Cleanup failed: ${cleanupError.message}`);
              }
            }

            if (failures.length) core.setFailed(failures.join('\n'));
