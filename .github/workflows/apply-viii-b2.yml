name: Apply Phase VIII-B2 route movement

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/route-movement-viii-b2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase VIII-B2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/route-movement-viii-b2
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply route movement implementation
        run: |
          python3 scripts/apply-viii-b2.py
          python3 scripts/update-viii-b2-tests.py

      - name: Install dependencies
        run: npm ci

      - name: Run regression suite
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Commit validated Phase VIII-B2 implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply-viii-b2.py scripts/update-viii-b2-tests.py .github/workflows/apply-viii-b2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: implement Phase VIII-B2 route movement"
          git push origin HEAD:agent/route-movement-viii-b2
