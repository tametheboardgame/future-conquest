name: WP4 defence and threat validation

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wp4:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout WP4 branch
        uses: actions/checkout@v4
        with:
          ref: agent/wp4-defence-threat-clarity
          fetch-depth: 0

      - name: Repair integration patcher
        run: node scripts/wp4-repair.mjs

      - name: Validate integration script
        run: node --check scripts/wp4-apply.mjs

      - name: Apply WP4 integration
        run: node scripts/wp4-apply.mjs

      - name: Normalise generated engine messages
        run: node scripts/wp4-postapply-fix.mjs

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression suite
        shell: bash
        run: |
          set +e
          npm test > wp4-test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "=== WP4 REGRESSION FAILURE CONTEXT ==="
            grep -n -A20 -B8 -E "not ok|AssertionError|ERR_ASSERTION|error TS|failed|FAIL" wp4-test.log | tail -n 240 || true
            echo "=== END FAILURE CONTEXT ==="
            exit "$status"
          fi
          tail -n 35 wp4-test.log

      - name: Build game
        run: npm run build

      - name: Commit validated WP4 implementation
        run: |
          rm scripts/wp4-apply.mjs scripts/wp4-repair.mjs scripts/wp4-postapply-fix.mjs .github/workflows/wp4-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/main.tsx src/components/MapView.tsx src/components/DefencePanel.tsx src/game/types.ts src/game/engine.ts src/game/defence.ts src/defence.css tests/wp4-defence-threat-clarity.test.cjs
          git add -A scripts/wp4-apply.mjs scripts/wp4-repair.mjs scripts/wp4-postapply-fix.mjs .github/workflows/wp4-apply.yml
          git status --short
          git commit -m "WP4: make territory defence and enemy threats actionable"
          git push origin HEAD:agent/wp4-defence-threat-clarity
