name: Apply R3 WP2D line hierarchy

on:
  push:
    branches:
      - agent/r3-wp2d-terrain-refinement
    paths:
      - 'scripts/apply-r3-wp2d-line-hierarchy.mjs'
      - '.github/workflows/r3-wp2d-apply-line-hierarchy.yml'

permissions:
  contents: write

jobs:
  apply-line-hierarchy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r3-wp2d-terrain-refinement
          fetch-depth: 0
      - name: Apply line hierarchy patch
        run: node scripts/apply-r3-wp2d-line-hierarchy.mjs
      - name: Commit line hierarchy implementation
        run: |
          git add src/components/TerrainMapPrototypeImpl.tsx
          if git diff --cached --quiet; then
            echo 'Line hierarchy patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refine terrain strategic line hierarchy'
          git push origin HEAD:agent/r3-wp2d-terrain-refinement
