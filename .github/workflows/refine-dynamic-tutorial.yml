name: Refine dynamic tutorial

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build:
    if: github.head_ref == 'agent/dynamic-mobile-tutorial' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dynamic-mobile-tutorial
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply capture transition refinement
        run: python scripts/refine-dynamic-tutorial.py

      - name: Install dependencies
        run: npm ci

      - name: Type-check tests
        run: npx tsc -p tsconfig.test.json --pretty false

      - name: Run regression suite
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Commit refinement
        run: |
          rm scripts/refine-dynamic-tutorial.py .github/workflows/refine-dynamic-tutorial.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Clear stale tutorial target after capture"
          git push origin HEAD:agent/dynamic-mobile-tutorial
